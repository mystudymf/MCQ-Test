name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KS" | base64 -d > mcq.keystore
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: App version
        id: v
        run: echo "ver=$(grep -o 'APP_VERSION="[^"]*"' index.html | head -1 | cut -d'"' -f2)" >> $GITHUB_OUTPUT
      - name: Prepare web files
        run: |
          mkdir www
          cp index.html www/
          cp icon-mcq-*.png www/
      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
          npx cap sync android
      - name: App icon and version
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-mcq-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.ver }}\"/" android/app/build.gradle
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign APK with the permanent key
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p 4 "$UN" aligned.apk
          $BT/apksigner sign --ks mcq.keystore --ks-pass pass:mcqquiz123 --key-pass pass:mcqquiz123 --ks-key-alias mcqquiz --out MCQ-Quiz.apk aligned.apk
          $BT/apksigner verify --print-certs MCQ-Quiz.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MCQ-Quiz-apk
          path: MCQ-Quiz.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.v.outputs.ver }}-${{ github.run_number }}
          name: MCQ-Quiz ${{ steps.v.outputs.ver }}
          files: MCQ-Quiz.apk
          make_latest: true
          body: |
            **How to install on Android**
            1. Download **MCQ-Quiz.apk** from the Assets list below.
            2. Open the downloaded file. If Android asks, allow installs from your browser or Files app.
            3. Tap **Install**. Android shows "Installing..." for a few seconds, then "App installed". Tap **Open**.
            4. On first start the app shows a setup screen with a progress bar, percentage and time left.

            **How to update later**
            Download the newest MCQ-Quiz.apk the same way and open it. Android shows **Update** (not Install) and keeps all your data. No need to uninstall.
