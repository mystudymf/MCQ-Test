name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html capacitor.config.json icon-mcq-512.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file in the repository root: $f"
              exit 1
            fi
          done
          ls icon-mcq-*.png
          echo "::notice::done: required files found"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check index.html for script errors
        run: |
          node -e "
          const h=require('fs').readFileSync('index.html','utf8');
          const m=[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(!m.length)throw new Error('index.html has no script block');
          m.forEach(x=>new Function(x[1]));
          console.log('script syntax ok');
          "
          echo "::notice::done: index.html script syntax ok"

      - name: Check signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KS" | base64 -d > mcq.keystore
          echo "::notice::done: signing key ok ($(wc -c < mcq.keystore) bytes)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (already on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "::notice::done: android sdk ready at $ANDROID_HOME"

      - name: App version
        id: v
        run: |
          VER=$(grep -o 'APP_VERSION="[0-9][0-9.]*"' index.html | head -1 | tr -dc '0-9.' || true)
          if [ -z "$VER" ]; then VER="1.0"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "::notice::done: app version=$VER; node $(node -v 2>&1)"

      - name: Prepare web files
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          WD=$(node -p "require('./capacitor.config.json').webDir || 'www'")
          echo "webDir=$WD"
          mkdir -p "$WD"
          cp index.html "$WD"/
          cp icon-mcq-*.png "$WD"/
          ls -la "$WD"
          echo "::notice::done: web files ready in $WD"

      - name: Create Android project
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
          npx cap sync android
          echo "::notice::done: android project created"

      - name: Camera permission (for scanning answer sheets)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.CAMERA" "$M"; then
            sed -i 's#<application#<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <application#' "$M"
          fi
          grep -n "permission\|uses-feature" "$M"
          echo "::notice::done: camera permission set"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: App icon, version and build settings
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}
            s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-mcq-512.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.v.outputs.ver }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          GRADLE
          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> android/gradle.properties
          grep -n "versionCode\|versionName" android/app/build.gradle
          echo "::notice::done: icons, version and build settings set"

      - name: Build APK
        working-directory: android
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/
          echo "::notice::done: gradle build finished"

      - name: Sign APK with the permanent key
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "build-tools: $BT"; echo "unsigned: $UN"
          "$BT/zipalign" -p 4 "$UN" aligned.apk
          "$BT/apksigner" sign --ks mcq.keystore --ks-pass pass:mcqquiz123 --key-pass pass:mcqquiz123 --ks-key-alias mcqquiz --out MCQ-Quiz.apk aligned.apk
          "$BT/apksigner" verify --print-certs MCQ-Quiz.apk
          echo "::notice::done: apk signed"

      - uses: actions/upload-artifact@v4
        with:
          name: MCQ-Quiz-apk
          path: MCQ-Quiz.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.v.outputs.ver }}-${{ github.run_number }}
          name: MCQ-Quiz ${{ steps.v.outputs.ver }}
          files: MCQ-Quiz.apk
          make_latest: true
          body: |
            **How to install on Android**
            1. Download **MCQ-Quiz.apk** from the Assets list below.
            2. Open the downloaded file. If Android asks, allow installs from your browser or Files app.
            3. Tap **Install**. Android shows "Installing..." for a few seconds, then "App installed". Tap **Open**.
            4. On first start the app shows a setup screen with a progress bar, percentage and time left.

            **How to update later**
            Download the newest MCQ-Quiz.apk the same way and open it. Android shows **Update** (not Install) and keeps all your data. No need to uninstall.

      - name: Show error details
        if: failure()
        run: |
          sleep 3
          if [ -f build.log ]; then
            MSG=$(tail -n 30 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build error - last log lines::$MSG"
          else
            echo "::error::No build log exists, so the run stopped before the build steps. Check which step has the red X."
          fi
