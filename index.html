const APP_VERSION="2.29.0",SHEET_ID="1KQ84FbJSDRd6ZQ0QdW-s9WE6qnL-dRmcIfwmq5CahtA",BUILTIN={"v":"15","subs":[{"id":"chem","name":"Chemistry","icon":"⚗️","dir":"ltr","on":true},{"id":"phy","name":"Physics","icon":"🧲","dir":"ltr","on":true},{"id":"quran","name":"ترجمۃ القرآن","icon":"📖","dir":"rtl","on":true},{"id":"urdu","name":"اردو","icon":"✍️","dir":"rtl","on":true},{"id":"eng","name":"English","icon":"📚","dir":"ltr","on":true},{"id":"math","name":"Mathematics","icon":"➗","dir":"ltr","on":true},{"id":"bio","name":"Biology","icon":"🧬","dir":"ltr","on":true},{"id":"cs","name":"Computer Science","icon":"💻","dir":"ltr","on":false},{"id":"isl","name":"Islamiyat","icon":"🕌","dir":"rtl","on":true},{"id":"urdu10","name":"اردو · Grade 10","icon":"🎓","dir":"rtl","on":true,"m":1}],"tops":[{"sid":"chem","t":"Chapter 1 · States of Matter and Phase Changes","q":[{"q":"Hazardous effects of shopping bags are studied in:","o":["Geochemistry","Inorganic Chemistry","Analytical Chemistry","Environmental Chemistry"],"a":3,"n":""},{"q":"The man-made polymer is:","o":["Starch","Polystyrene","Protein","Cellulose"],"a":1,"n":""},{"q":"Which liquid among the following is a colloidal solution?","o":["Milk","Slaked lime used for white wash","Vinegar solution","Mixture of AgCl in water"],"a":0,"n":""},{"q":"Which of the following is a heterogeneous mixture?","o":["A solution of calcium hydroxide in water","A solution of potassium nitrate in water","Hot chocolate","Concrete mixture"],"a":3,"n":""},{"q":"When the tiny visible particles of a substance are dispersed through a medium, the mixture is named as:","o":["True solution","Colloid","Suspension","Saturated solution"],"a":2,"n":""}]},{"sid":"chem","t":"Chapter 2 · Atomic Structure","q":[{"q":"How many electrons can be accommodated at the most in the third shell of the elements?","o":["8","18","10","32"],"a":1,"n":"Using the 2n² formula for n = 3 (M shell): 2 × 3² = 18 electrons."},{"q":"What information was obtained from discharge tube experiments?","o":["Structure of atom was discovered.","Neutrons and protons were discovered.","Electrons and protons were discovered.","Presence of nucleus in an atom was discovered."],"a":2,"n":"Cathode ray and canal ray experiments in discharge tubes proved atoms contain negatively charged electrons and positively charged protons."},{"q":"In which isotope of oxygen are there equal numbers of protons, electrons and neutrons?","o":["¹⁷O","¹⁶O","¹⁸O","None of these"],"a":1,"n":"Oxygen has atomic number Z = 8 (8 protons, 8 electrons). In ¹⁶O, neutrons = 16 - 8 = 8."},{"q":"What will be the relative atomic mass of nitrogen given the abundances of its two isotopes, ¹⁴N and ¹⁵N are 99.64% and 0.35% respectively?","o":["14.0210","14.0021","14.2100","14.1200"],"a":1,"n":"(14 × 99.64 + 15 × 0.35) / 100 = (1394.96 + 5.25) / 100 = 14.0021 amu."},{"q":"What keeps the particles present in the nucleus intact?","o":["Particles are held together by strong nuclear force.","Particles are held together by weak nuclear force.","Particles are held together by electrostatic force.","Particles are held together by dipolar force."],"a":0,"n":"Protons and neutrons inside the nucleus are bound together by the strong nuclear force."},{"q":"How do electrons keep themselves away from the oppositely charged nucleus?","o":["By keeping themselves stationary","By revolving around the nucleus","Due to their wave-like nature","A magnetic field around the nucleus keeps them away"],"a":1,"n":"According to Bohr's model, electrons revolve rapidly in fixed circular orbits around the nucleus."}]},{"sid":"chem","t":"Chapter 3 · Chemical Bonding","q":[{"q":"When molten copper and molten zinc are mixed together, they give rise to a new substance called brass. Predict what type of bond is formed between copper and zinc.","o":["Coordinate covalent bond","Ionic bond","Metallic bond","Covalent bond"],"a":2,"n":"Both copper and zinc are metals, so their atoms are held together by a sea of delocalized electrons (metallic bond)."},{"q":"Which element is capable of forming all the three types of bonds: covalent, coordinate covalent and ionic?","o":["Carbon","Oxygen","Magnesium","Silicon"],"a":1,"n":"Oxygen forms ionic bonds (e.g., MgO), covalent bonds (e.g., H₂O), and coordinate covalent bonds (e.g., H₃O⁺)."},{"q":"Why is H₂O a liquid while H₂S is a gas?","o":["Because in water, the atomic size of oxygen is smaller than that of sulphur","Because water is a polar compound and there exist strong hydrogen bonding forces of attraction between its molecules","Because H₂O molecule is lighter than H₂S","Because water can easily freeze into ice"],"a":1,"n":"Strong intermolecular hydrogen bonding in H₂O keeps its molecules closely attracted as a liquid at room temperature."},{"q":"Which of the following bonds is expected to be the weakest?","o":["C–C","Cl–Cl","O–O","F–F"],"a":3,"n":"Due to the very small atomic size of fluorine, strong lone-pair repulsion weakens the F–F single bond."},{"q":"Keeping in view the intermolecular forces of attraction, indicate which compound has the highest boiling point.","o":["H₂O","H₂S","HF","NH₃"],"a":0,"n":"Water forms extensive hydrogen bonding (two H-bonds per molecule), giving it a higher boiling point (100°C) than HF, NH₃, or H₂S."},{"q":"Which metal has the lowest melting point?","o":["Li","Na","K","Rb"],"a":3,"n":"Down Group 1, atomic size increases and metallic bond strength decreases, so Rubidium (Rb) has the lowest melting point among these."},{"q":"Which ionic compound has the highest melting point?","o":["NaCl","KCl","LiCl","RbCl"],"a":0,"n":"NaCl has a high lattice energy and strong electrostatic attraction in its crystal lattice (m.p. 801°C, higher than LiCl, KCl, RbCl)."},{"q":"Which among the following has a double covalent bond?","o":["Ethane","Methane","Ethylene","Acetylene"],"a":2,"n":"Ethylene (ethene, C₂H₄) contains a C=C double covalent bond formed by sharing two pairs of electrons."}]},{"sid":"chem","t":"Chapter 4 · Stoichiometry","q":[{"q":"How many atoms are present in one gram of H₂O?","o":["1002 × 10²³ atoms","6.022 × 10²³ atoms","0.334 × 10²³ atoms","2.004 × 10²³ atoms"],"a":0,"n":"Book key: (a). Moles in 1 g H₂O = 1/18 mol. Molecules = (1/18) × 6.022 × 10²³ = 0.3345 × 10²³. Since each H₂O molecule has 3 atoms, total atoms = 3 × 0.3345 × 10²³ = 1.003 × 10²³ (printed as 1002 × 10²³ in textbook key/options)."},{"q":"Which is the correct formula of calcium phosphide?","o":["CaP","CaP₂","Ca₂P₃","Ca₃P₂"],"a":3,"n":"Calcium ion is Ca²⁺ and phosphide ion is P³⁻; crisscrossing valencies gives Ca₃P₂."},{"q":"How many atomic mass units (amu) are there in one gram?","o":["1 amu","10²³ amu","6.022 × 10²³ amu","6.022 × 10²² amu"],"a":2,"n":"1.00 g equals Avogadro's number of amu, i.e., 6.022 × 10²³ amu."},{"q":"Structural formula of 2-hexene is CH₃−CH=CH−(CH₂)₂−CH₃. What will be its empirical formula?","o":["C₂H₂","CH","C₆H₁₂","CH₂"],"a":3,"n":"The molecular formula is C₆H₁₂. Dividing by the common factor 6 gives the simplest whole number ratio CH₂."},{"q":"How many moles are there in 25 g of H₂SO₄?","o":["0.765 moles","0.51 moles","0.255 moles","0.4 moles"],"a":2,"n":"Molar mass of H₂SO₄ = 98 g/mol. Moles = 25 / 98 = 0.255 moles."},{"q":"A necklace has 6 g of diamonds in it. What are the number of carbon atoms in it?","o":["6.02 × 10²³","12.04 × 10²³","1.003 × 10²³","3.01 × 10²³"],"a":3,"n":"Diamond is pure carbon (molar mass 12 g/mol). 6 g = 0.5 mol, which contains 0.5 × 6.02 × 10²³ = 3.01 × 10²³ atoms."},{"q":"What is the mass of Al in 204 g of aluminium oxide, Al₂O₃?","o":["26 g","27 g","54 g","108 g"],"a":3,"n":"Molar mass of Al₂O₃ = 2(27) + 3(16) = 102 g/mol. 204 g = 2 moles of Al₂O₃, containing 4 moles of Al = 4 × 27 = 108 g."}]},{"sid":"chem","t":"Chapter 5 · Energetics","q":[{"q":"The following reaction is an exothermic reaction: H₂ + Cl₂ —(Sunlight)→ 2HCl. From where does the energy come to break the bonds of H₂ and Cl₂?","o":["By collisions between the molecules","From sunlight","From the surrounding","By collisions of the molecules with the walls of the container"],"a":1,"n":"As indicated over the reaction arrow, sunlight provides the activation energy needed to break the initial bonds."},{"q":"Which of the following reactions has the least value of activation energy?","o":["H₂(g) + 1/2 O₂(g) → H₂O(g)","C(s) + O₂(g) → CO₂(g)","NaCl(aq) + AgNO₃(aq) → AgCl(s) + NaNO₃(aq)","H₂(g) + I₂(s) → 2HI(g)"],"a":2,"n":"Ionic precipitation reactions in aqueous solution occur instantaneously because ions are already dissociated, requiring almost zero activation energy."},{"q":"Formation of which hydrogen halide from the elements is an endothermic reaction?","o":["HCl","HF","HBr","HI"],"a":3,"n":"As given in the textbook (page 71), H₂(g) + I₂(s) → 2HI(g) absorbs 53.08 kJ of heat (ΔH = +53.08 kJ)."},{"q":"What are the products of anaerobic respiration?","o":["ATP + CO₂ + H₂O","CO₂ + H₂O","ATP + Ethanol + H₂O","Ethanol + CO₂ + Energy (ATP)"],"a":2,"n":"In the textbook equation (page 78), anaerobic respiration in yeast converts glucose into ethanol (C₂H₅OH), CO₂, and energy (ATP); option (c) is the closest match among the printed textbook options."},{"q":"Which reaction energy profile diagram do you expect to be a reversible reaction?","o":["Exothermic diagram where products are much lower in energy than reactants (large reverse barrier)","Diagram where reactants (A+B) and products (C+D) are at nearly the same energy level with comparable forward and reverse activation energies","Endothermic diagram with a moderate energy rise to C+D","Highly endothermic diagram with almost no reverse activation energy barrier"],"a":1,"n":"A reaction is easily reversible when the forward and reverse activation energies are comparable, meaning reactants and products have similar energy levels."},{"q":"The average bond dissociation energy for the C−H bond is 412 kJ mol⁻¹. Which of the following processes will have enthalpy change close to 412 kJ mol⁻¹?","o":["CH₄(g) → C(s) + 2H₂(g)","CH₄(g) → C(g) + 2H₂(g)","CH₄(g) → C(g) + 4H(g)","CH₄(g) → CH₃(g) + H(g)"],"a":3,"n":"Breaking a single C−H bond in CH₄(g) to form CH₃(g) + H(g) requires 412 kJ mol⁻¹."}]},{"sid":"chem","t":"Chapter 6 · Chemical Equilibrium","q":[{"q":"What will happen if the rates of forward and reverse reactions are very high?","o":["The equilibrium point will reach very soon.","The equilibrium point will reach very late.","The reaction will not attain the state of dynamic equilibrium.","The reaction will be practically irreversible."],"a":0,"n":""},{"q":"Predict which components of the atmosphere react in the presence of lightening.","o":["N₂ and H₂O","O₂ and H₂O","CO₂ and O₂","N₂ and O₂"],"a":3,"n":""},{"q":"An inorganic chemist places one mole of PCl₅ in a container A and one mole of each Cl₂ and PCl₃ in container B. Both the containers were sealed and heated to the same temperature to reach the state of equilibrium. Guess about the composition of mixtures in both the containers.","o":["Both the containers will have the same composition of mixtures.","Container A will have more concentration of PCl₃ than B.","Container A will have less concentration of PCl₃ than B.","Both the containers will have zero concentration of its reactants."],"a":0,"n":""},{"q":"CaO or lime is used extensively in steel, glass and paper industries. It is produced in an exothermic reversible reaction by the decomposition of lime (CaCO₃). Choose the conditions to produce maximum amount of lime.","o":["Heating at high temperature in a closed vessel","Heating at high temperature in an open vessel","Cooling it in a closed vessel","Cooling it in an open vessel"],"a":1,"n":"Book key: (b). (CaCO₃ decomposition is actually endothermic; book key followed.)"},{"q":"What condition should be met for the reversible reaction to achieve the state of equilibrium?","o":["All the reactants should be converted into the products.","50% of the reactants should be converted into products.","The concentration of all the reactants and the product should become constant.","One of the products should be removed from the reaction mixture."],"a":2,"n":""},{"q":"Why the gas starts coming out when you open a can of fizzy drink?","o":["Because the solubility of the gas increases","Because the gas is insoluble in water","Because the gas is dissolved under pressure hence it comes out when pressure is decreased","Because the solubility of the gas decreases at high pressure"],"a":2,"n":""},{"q":"The following reaction is performed in an open vessel. CaCO₃(s) ⇌ CaO(s) + CO₂(g). How the equilibrium will be affected if you increase the pressure?","o":["The forward reaction will be favoured","The backward reaction will be favoured","No effect on backward reaction","No effect on forward or backward reaction"],"a":3,"n":"Book key: (d). In an open vessel CO₂ escapes, so pressure has no effect on the reaction."},{"q":"When a reaction will become a reversible one?","o":["If the activation energy of the forward reaction is comparable to that of backward reaction","If the activation energy of the forward reaction is higher than that of backward reaction","If the activation energy of the forward reaction is lower than that of backward reaction","If the enthalpy change of both the reactions is zero."],"a":0,"n":""},{"q":"Are reversible reactions useful for preparing compounds on large scale?","o":["No","Yes","They are useful only when equilibrium lies far to the right side","They are useful only when equilibrium lies far to the left side"],"a":2,"n":""},{"q":"What will happen to the concentrations of the products if a reversible reaction at equilibrium is not disturbed?","o":["They will remain constant","They will keep on increasing","They will keep on decreasing","They will remain constant for some time and then start decreasing"],"a":0,"n":""},{"q":"In an irreversible reaction, equilibrium is:","o":["established quickly","established slowly","never established","established when reaction stops"],"a":2,"n":""},{"q":"The characteristics of reversible reactions are the following except:","o":["products never recombine to form reactants","they never complete","they proceed in both ways","they have a double arrow between reactants and products"],"a":0,"n":""},{"q":"The reactions in which the products do not recombine to form reactants are called:","o":["Irreversible reactions","Reversible reactions","Decomposition reactions","Addition reactions"],"a":0,"n":""},{"q":"The reactions in which the products can recombine to form reactants are called:","o":["Irreversible reactions","Reversible reactions","Decomposition reactions","Addition reactions"],"a":1,"n":""},{"q":"Which type of reaction speeds up gradually?","o":["Irreversible reactions","Reverse reactions","Forward reactions","Decomposition reactions"],"a":1,"n":""},{"q":"Reactions that continue in both directions are called:","o":["Irreversible","Reversible","Non-reactive","Dynamic"],"a":1,"n":""},{"q":"In a chemical reaction, the substances that combine are called:","o":["Reactants","Products","Masses","Materials"],"a":0,"n":""},{"q":"The forward reaction takes place from:","o":["Right to left","Left to right","Both a & b","None of the above"],"a":1,"n":""},{"q":"Equilibrium state can be achieved in:","o":["Closed system","Open system","Both a & b","None of these"],"a":0,"n":""},{"q":"A complete reaction is one in which:","o":["All the reactants convert into products","All the reactants do not convert into products","Half reactants convert into products","Only 10% reactants convert into products"],"a":0,"n":""},{"q":"In the beginning the rate of reverse reaction is:","o":["Moderate","Negligible","Slow","Very fast"],"a":1,"n":""},{"q":"The new substance formed in a chemical reaction is:","o":["Reactant","Product","Forward","Reverse"],"a":1,"n":""},{"q":"The colour of anhydrous copper (II) sulphate solid is:","o":["Blue","Pink","Black","White"],"a":3,"n":""},{"q":"The colour of hydrated copper (II) sulphate solid is:","o":["Blue","Pink","Black","White"],"a":0,"n":""},{"q":"The colour of anhydrous cobalt (II) chloride solid is:","o":["Blue","Pink","Black","White"],"a":0,"n":""},{"q":"The colour of hydrated cobalt (II) chloride solid is:","o":["Blue","Pink","Black","White"],"a":1,"n":""},{"q":"Which of the following does not happen when a system is at equilibrium state?","o":["Forward and reverse reactions stop","Forward and reverse rates become equal","Concentration of reactants and products stop changing","Reaction continues to occur in both the directions"],"a":0,"n":""},{"q":"Which is true about the equilibrium state?","o":["The forward reaction stops","The reverse reaction stops","Both forward and reverse reactions stop","Both forward and reverse reactions continue at the same rate"],"a":3,"n":""},{"q":"When a system is at equilibrium state:","o":["The concentration of reactants and product becomes equal","The opposing reactions (forward the reverse) stop","The rate of the reverse reaction becomes very low","The rate of the forward and reverse reactions become equal"],"a":3,"n":""},{"q":"When the rate of the forward reaction takes place at the rate of reverse reaction the composition of the reaction mixture remains constant, it is called:","o":["chemical equilibrium","static equilibrium","both (a) & (b)","none of the above"],"a":0,"n":""},{"q":"Which type of reactions do not go to completion?","o":["irreversible reactions","reversible reactions","addition reactions","decomposition reactions"],"a":1,"n":""},{"q":"For the following reaction, equilibrium mixture will contain: N₂O₄(g) ⇌ 2NO₂(g), Kc = 0.211","o":["Only N₂O₄","Only NO₂","NO₂ and N₂O₄ in reasonable amount","NO₂ in large amount"],"a":2,"n":""},{"q":"Nitrogen and hydrogen were reacted together to make ammonia: N₂ + 3H₂ ⇌ 2NH₃, Kc = 2.86 mol⁻²dm⁶. What will be present in the equilibrium mixture?","o":["NH₃ only","N₂, H₂ and NH₃","N₂ and H₂ only","H₂ only"],"a":1,"n":""},{"q":"Concentration of reactants and products at equilibrium remains unchanged if:","o":["Concentration of any reactant or product is not changed","Temperature of the reaction is not changed","Pressure or volume of the system is not changed","All of the above are observed"],"a":3,"n":""},{"q":"At what temperature, rate of ammonia formation and decomposition is the highest:","o":["300 °C","400 °C","500 °C","600 °C"],"a":1,"n":"Book key: (b) 400 °C (the usual working temperature for ammonia). Strictly, rates rise with temperature, so 600 °C is fastest; book key followed."},{"q":"Formation of ammonia from nitrogen and hydrogen is an:","o":["Exothermic Reaction","Endothermic Reaction","Both A & B","No heat change"],"a":0,"n":""},{"q":"How much heat absorbed when NH₃ decomposed into N₂ and H₂?","o":["90.4 kJ/mol","94.2 kJ/mol","92.4 kJ/mol","95.2 kJ/mol"],"a":2,"n":""},{"q":"Which compound is used a thinner in paint industry?","o":["C₂H₅OH","CH₃COOH","CH₃COOC₂H₅","H₂O"],"a":2,"n":""}]},{"sid":"chem","t":"Chapter 7 · Acids and Bases","q":[{"q":"Which acid is not used as a food or mixed with food?","o":["Tartaric acid","Ascorbic acid","Citric acid","Formic acid"],"a":3,"n":""},{"q":"While baking, which gas is responsible for raising the bread and making it soft?","o":["Oxygen","Carbon dioxide","Nitrogen","Carbon monoxide"],"a":1,"n":""},{"q":"Predict the main characteristics of the reactions of metals with acids.","o":["Metals are dissolved","Metals are converted into salts","Hydrogen gas is evolved","All the above mentioned characteristics are true"],"a":3,"n":""},{"q":"How many hydroxide ions, calcium hydroxide will release in water?","o":["1","2","Zero","3"],"a":1,"n":""},{"q":"In a neutralization reaction between KOH and H₃PO₄, how many molecules of KOH will react with one molecule of H₃PO₄?","o":["2","1","3","4"],"a":2,"n":""},{"q":"Which acid is used in the preparation of soap?","o":["Tartaric acid","Citric acid","Stearic acid","Oxalic acid"],"a":2,"n":""},{"q":"Which compound is formed when SO₂ is dissolved in water?","o":["SO₃","H₂SO₃","H₂SO₄","H₂S₂O₇"],"a":1,"n":""},{"q":"Which of the following contains oxalic acid?","o":["Tomato","Orange","Tamarind","Sour milk"],"a":0,"n":""},{"q":"Which compound in the following reaction is behaving as a conjugate base? CH₃COOH(aq) + H₂O(l) → CH₃COO⁻ + H₃O⁺(aq)","o":["CH₃COOH","H₂O","CH₃COO⁻","H₃O⁺"],"a":2,"n":""},{"q":"When a chemical reaction is carried out with a substance Z; a gas is produced which turns red litmus paper blue. What is the reaction?","o":["Reaction of an acid with a metal carbonate","Reaction of an acid with a metal hydrogen carbonate","Reaction of an alkali with acid","Reaction of an alkali with ammonium salt"],"a":3,"n":""},{"q":"A base is a substance which neutralizes an acid. Which of these substances is not a base?","o":["Aqueous ammonia","Sodium chloride","Sodium carbonate","Calcium oxide"],"a":1,"n":""},{"q":"Acetic acid is used for:","o":["Flavouring food","Making explosives","Etching designs","Cleaning metals"],"a":0,"n":""},{"q":"Acids means:","o":["Sour","Bitter","Sweet","Salty"],"a":0,"n":""},{"q":"All acids turn blue litmus:","o":["Red","Colourless","Pink","White"],"a":0,"n":"Acids turn blue litmus red."},{"q":"All bases turn red litmus:","o":["Colourless","Blue","Pink","White"],"a":1,"n":""},{"q":"Which of the following cannot be classified as Arrhenius acid?","o":["HNO₃","H₂CO₃","CO₂","H₂SO₄"],"a":2,"n":""},{"q":"Milk of magnesia contains Mg(OH)₂. It is used as antacid. It neutralizes excess stomach acid. Which salt is formed in this reaction?","o":["MgSO₄","MgCO₃","MgCl₂","MgO"],"a":2,"n":""},{"q":"According to Arrhenius concept acid is a substance which dissociates in aqueous solution to give:","o":["Hydrogen ions","Hydroxide ions","Protons","Pair of electrons"],"a":0,"n":""},{"q":"According to Arrhenius concept base is a substance which dissociates in aqueous solution to give:","o":["Hydrogen ions","Hydroxide ions","Protons","Pair of electrons"],"a":1,"n":""},{"q":"Which one is not an Arrhenius base?","o":["NaOH","KOH","Ca(OH)₂","NH₃"],"a":3,"n":""},{"q":"Which one is not an Arrhenius acid?","o":["HCl","H₂SO₄","CO₂","HNO₃"],"a":2,"n":""},{"q":"Which of the following is Brønsted base?","o":["NH₃","HCl","CH₃COOH","H₃O⁺"],"a":0,"n":""},{"q":"Ammonia is a base, because it:","o":["Ionizes in water to give OH⁻ ions","Contains OH group","Can accept an electron pair","Can accept proton"],"a":3,"n":""},{"q":"Consider the following reaction: H₂O + HCl ⇌ H₃O⁺ + Cl⁻. Which species is a proton acceptor in this reaction?","o":["H₂O","HCl","H₃O⁺","None"],"a":0,"n":""},{"q":"According to Brønsted and Lowry concept, an acid is a substance that can donate:","o":["Proton","Electron pair","Neutron","Electron"],"a":0,"n":""},{"q":"A substance which can behave as an acid as well as a base is called:","o":["Acid","Base","Amphoteric specie","Neutral specie"],"a":2,"n":""},{"q":"A reaction between an acid and a base produces:","o":["Salt and water","Salt and gas","Salt and an acid","Salt and a base"],"a":0,"n":""},{"q":"Which acid is present in our stomach?","o":["Nitric acid","Hydrochloric acid","Sulphuric acid","All of the above"],"a":1,"n":""},{"q":"When acids react with metals, which gas is evolved?","o":["H₂","O₂","Cl₂","N₂"],"a":0,"n":""},{"q":"When acids react with carbonates and bicarbonates, which gas is produced:","o":["H₂","CO₂","Cl₂","N₂"],"a":1,"n":""},{"q":"Alkalies react with ammonium salts to liberate:","o":["SO₂","CO₂","NH₃","H₂"],"a":2,"n":""},{"q":"Which is used to manufacture soap?","o":["NaOH","Ca(OH)₂","NH₄OH","Mg(OH)₂"],"a":0,"n":""},{"q":"Acid rain has pH less than:","o":["7","6","4","5.6"],"a":3,"n":"Book key: (d) 5.6 (rain is normally ≈5.6; acid rain is below this)."},{"q":"Caustic chemical drain cleaner are capable of dissolving:","o":["Grease","Hair","Food","All of these"],"a":3,"n":""}]},{"sid":"chem","t":"Chapter 8 · Periodic Table and Periodicity","q":[{"q":"In which period and group will you place the element which is an important part of the solar cell?","o":["Third period and 14th group","Second period and 14th group","Third period and 15th group","Third period and 16th group"],"a":0,"n":"Silicon (Si, atomic number 14) is the key semiconductor used in solar cells; its electronic configuration (2, 8, 4) places it in the 3rd period and 14th group."},{"q":"Identify the electronic configuration of the outermost shell of a transition metal.","o":["ns²np⁴","ndˣns²","ns²np⁶","ns²np⁵"],"a":1,"n":"According to Table 8.2, transition metals (Groups 3 to 12) have the general valence/outermost configuration ndˣns² (where d-subshells are being filled)."},{"q":"Which is the softest metal?","o":["Na","Ca","Al","Zn"],"a":0,"n":"Sodium (Na) is a Group 1 alkali metal with weak metallic bonding due to a single valence electron and large atomic size, making it soft enough to cut with a knife."},{"q":"A yellow solid element exists in allotropic forms which is also present in fossil fuels. Indicate the name.","o":["Carbon","Iodine","Aluminium","Sulphur"],"a":3,"n":"Sulphur is a yellow non-metallic solid that exists in allotropic forms (rhombic, monoclinic) and occurs as an impurity in fossil fuels."},{"q":"How many electrons can nitrogen accept in its outermost shell?","o":["2","3","4","5"],"a":1,"n":"Nitrogen belongs to Group 15 with 5 valence electrons (ns²np³), so it can accept 3 electrons to complete its octet and form N³⁻."},{"q":"Which element is the most reactive element?","o":["Oxygen","Chlorine","Fluorine","Nitrogen"],"a":2,"n":"Fluorine (F) is at the top of Group 17 with the smallest atomic radius and highest electronegativity (4.0), making it the most reactive non-metal."},{"q":"Which element has the highest melting point?","o":["Na","K","Rb","Cs"],"a":0,"n":"In Group 1, melting point decreases down the group as atomic size increases and metallic bonding weakens; therefore, Na (98 °C) has a higher melting point than K, Rb, and Cs."},{"q":"The element having less value of ionization energy and less value of electron affinity is likely to belong to:","o":["Group 1","Group 13","Group 16","Group 17"],"a":0,"n":"Group 1 (alkali metals) have the largest atomic radii in their respective periods, giving them the lowest ionization energies and lowest electron affinities."}]},{"sid":"chem","t":"Chapter 9 · Group Properties and Elements","q":[{"q":"Which halogen will have the least reactivity with alkaline earth metals?","o":["Chlorine","Iodine","Bromine","Fluorine"],"a":1,"n":"Reactivity of halogens decreases down Group 17 as atomic radius increases and electron-accepting tendency weakens; hence iodine is the least reactive among the four."},{"q":"Which compound do you expect to be coloured?","o":["KCl","BaCl₂","AlCl₃","NiCl₂"],"a":3,"n":"Nickel (Ni) is a transition metal (Group 10), and transition metal compounds such as NiCl₂ are characteristically coloured, whereas main-group salts (KCl, BaCl₂, AlCl₃) are white."},{"q":"In which element do there exist the strongest forces of attraction between atoms?","o":["Mg","Ca","Sr","Ba"],"a":0,"n":"Magnesium (Mg) has the smallest atomic radius in Group 2 among these options, allowing its delocalized valence electrons to be held most strongly by the nuclei."},{"q":"Elements of which group are all coloured?","o":["Second group","Sixth group","Fourth group","Fifth group"],"a":1,"n":"Book key: (b). Group 6 (Cr, Mo, W) consists entirely of transition elements, whose compounds and metals are coloured."},{"q":"Which halogen acid is unstable at room temperature?","o":["HBr","HI","HCl","HF"],"a":1,"n":"Thermal stability of hydrogen halides decreases down the group (HF > HCl > HBr > HI) because the H–I bond is longest and weakest, making HI decompose easily at room temperature."},{"q":"Which oxide is the most basic oxide?","o":["Na₂O","Li₂O","MgO","CO"],"a":0,"n":"Basicity of metal oxides increases down a group and decreases across a period; Na₂O (Group 1, Period 3) is more strongly basic than Li₂O (Period 2), MgO (Group 2), and neutral CO."},{"q":"Which group elements are the most reactive elements?","o":["Transition metal group","First group","Second group","Third group"],"a":1,"n":"Group 1 alkali metals have only one loosely held valence electron and the lowest ionization energies, making them the most reactive metals."},{"q":"Which property is correct for Group 1 elements?","o":["Low catalytic activity","High density","Low electrical conductivity","High melting point"],"a":0,"n":"Group 1 alkali metals have low densities, low melting points, high electrical conductivity, and—unlike transition metals—low catalytic activity."}]},{"sid":"chem","t":"Chapter 10 · Environmental Chemistry","q":[{"q":"Indicate the source of sulphur which is responsible for the presence of oxides of sulphur in the atmosphere.","o":["Decomposition of vegetation","Waste gases from digestion of animals","Photochemical smog","Combustion of fossil fuels"],"a":3,"n":"Fossil fuels such as coal and petroleum contain sulphur compounds that oxidize during combustion to release SO₂ and SO₃ into the air."},{"q":"Concentration of which gas in the atmosphere is decreased by photosynthesis in plants?","o":["Oxygen","Nitrogen","Carbon dioxide","Water vapours"],"a":2,"n":"During photosynthesis, green plants absorb carbon dioxide (CO₂) and water in the presence of sunlight and chlorophyll to produce glucose and oxygen."},{"q":"People of which age groups are most affected by the air pollution?","o":["Young adults","Middle age people","Children","Both children and aged people"],"a":3,"n":"Children under 18 and adults over 65 (along with people having chronic heart/lung disease or diabetes) belong to the high-risk groups most vulnerable to air pollution."},{"q":"In which area there is a greater possibility of acid rain?","o":["Around village","Around big cities","Around industrial area","Around water bodies"],"a":2,"n":"Industrial areas burn large quantities of fossil fuels, releasing high amounts of SO₂ and NOₓ that react with atmospheric moisture to form acid rain."},{"q":"Why is smog not felt in summer?","o":["Because fog is not present in summer","Because due to heat of the Earth the smoke rises up","Because in summer smoke and fog cannot mix with each other","Because less fossil fuels are burnt in summer"],"a":0,"n":"Smog is formed when smoke mixes with fog in cold winter conditions; because fog does not form in summer, winter smog is not experienced."},{"q":"Which gases contribute towards the formation of acid rain?","o":["Oxides of carbon","Oxides of sulphur","Oxides of nitrogen","Both the oxides of nitrogen and sulfur"],"a":3,"n":"Both oxides of sulphur (SO₂, SO₃) and oxides of nitrogen (NO, NO₂) dissolve in atmospheric moisture to produce H₂SO₄, HNO₃, and HNO₂."}]},{"sid":"chem","t":"Chapter 11 · Hydrocarbons","q":[{"q":"Which other atom is almost always present along with carbon atom in all organic compounds?","o":["Oxygen","Nitrogen","Hydrogen","Halogen"],"a":2,"n":"Almost all organic compounds contain hydrogen covalently bonded to carbon (hydrocarbons and their derivatives)."},{"q":"Which other metal can be used to reduce alkyl halides (in addition to zinc)?","o":["Al","Mg","Ni","Co"],"a":1,"n":"Active metals like magnesium (Mg) or zinc (Zn) in acidic medium generate nascent hydrogen to reduce alkyl halides to alkanes."},{"q":"Why does a mixture of zinc and hydrochloric acid act as a reducing agent?","o":["Because zinc acts as a reducing agent.","Because atomic hydrogen is produced with Zn / HCl which acts as a reducing agent.","Because molecular hydrogen is produced with Zn / HCl which acts as a reducing agent.","Because chloride ions are produced with Zn / HCl which act as a reducing agent."],"a":1,"n":"Zn reacts with HCl to generate nascent (atomic) hydrogen [H], which reduces the alkyl halide (R–X + 2[H] → R–H + H–X)."},{"q":"Which alkane will evolve the most amount of heat when it is burnt with oxygen?","o":["Ethane","Propane","n-Butane","iso-Butane"],"a":2,"n":"Among these alkanes, butane has the most carbon and hydrogen atoms (4 carbons), and straight-chain n-butane has slightly higher enthalpy of combustion than branched iso-butane."},{"q":"Which hydrocarbon is responsible for explosions in coal mines?","o":["Butane","Pentane","Methane","Ethene"],"a":2,"n":"Methane (marsh gas/firedamp) accumulates in coal mines and forms an explosive mixture with air when ignited."},{"q":"Which product will be formed when ethyl bromide (CH₃CH₂Br) is treated with Zn/HCl?","o":["CH₄","CH₃–CH₃","CH₃–CH₂–CH₂–CH₃","CH₃–CH₂–CH₃"],"a":1,"n":"Reduction of ethyl bromide (CH₃CH₂Br) with Zn/HCl replaces the –Br atom with –H, yielding ethane (CH₃–CH₃)."}]},{"sid":"phy","t":"Turning Effect of Force · Page 1 – Parallel Forces","q":[{"q":"The line along which a force acts is called:","o":["line of action","resultant force","head to tail rule","all of these"],"a":0,"n":""},{"q":"If the forces are parallel to each other and in opposite directions, they are called:","o":["parallel force","like parallel force","unlike parallel force","resultant force"],"a":2,"n":""},{"q":"Forces which are parallel to each other and have the same direction are:","o":["parallel force","like parallel force","unlike parallel force","resultant force"],"a":1,"n":""},{"q":"Forces which are parallel to each other and have opposite directions are:","o":["parallel force","like parallel force","unlike parallel force","resultant force"],"a":2,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 2 – Torque","q":[{"q":"Unit of torque is:","o":["Nm","kgm²s⁻²","N","Both A and B"],"a":3,"n":""},{"q":"Anticlockwise torque is taken as:","o":["Positive","Negative","Composite","Scalar"],"a":0,"n":""},{"q":"Clockwise torque is taken as:","o":["Positive","Negative","Composite","Scalar"],"a":1,"n":""},{"q":"A uniform beam is pivoted at its centre. A 30 N weight is 40 cm left of the pivot and a 60 N weight is 30 cm right of the pivot. The beam is balanced by an upward force F at the right end, 50 cm from the pivot. What is the size of F?","o":["6 N","12 N","30 N","60 N"],"a":1,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 3 – Torque and Moment Arm","q":[{"q":"Unit of moment arm is:","o":["Nm","kgm²s⁻²","m","Both A and B"],"a":2,"n":""},{"q":"The torque of a rotating fan is:","o":["Positive","Negative","Zero","Scalar"],"a":2,"n":""},{"q":"Torque depends on:","o":["Force","Moment arm","Acceleration","Both (A) and (B)"],"a":3,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 4 – Like and Unlike Parallel Forces","q":[{"q":"The angle between like parallel forces is:","o":["0°","90°","180°","270°"],"a":0,"n":""},{"q":"The angle between unlike parallel forces is:","o":["0°","90°","180°","270°"],"a":2,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 5 – Centre of Gravity","q":[{"q":"The centre of gravity of a parallelogram, rectangle, square is the:","o":["Point of intersection of the medians","Central point of axis","Point of intersection of the diagonals","Centre of parallelogram"],"a":2,"n":""},{"q":"The centre of gravity of a regular shaped body is always on its centre of:","o":["Body","Symmetry","Medians","Axis"],"a":1,"n":""},{"q":"Four shapes A, B, C, D are cut from the same piece of card (diagram in your PDF). Which shape has its centre of mass nearest to the base line?","o":["A","B","C","D"],"a":2,"n":""},{"q":"The centre of gravity of a triangle is the:","o":["Point of intersection of the medians","Central point of axis","Point of intersection of the diagonals","Centre of parallelogram"],"a":0,"n":""},{"q":"The centre of gravity of a cylinder is the:","o":["Point of intersection of the medians","Central point of axis","Point of intersection of the diagonals","Centre of parallelogram"],"a":1,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 6 – Equilibrium","q":[{"q":"How many conditions of equilibrium are there?","o":["1","2","3","4"],"a":1,"n":""},{"q":"When the sum of all forces on a body is zero or the object moves with uniform velocity, it is in:","o":["Rest","Motion","Equilibrium","None of above"],"a":2,"n":""},{"q":"According to the first condition of equilibrium, the sum of all forces acting on the body should be:","o":["Positive","Zero","None","All of above"],"a":1,"n":""},{"q":"The first condition of equilibrium is represented by:","o":["∑F = 0","∑Fx = 0","∑Fy = 0","All of above"],"a":3,"n":""},{"q":"According to the second condition of equilibrium, the sum of all torques acting on the body should be:","o":["Positive","Zero","None","All of above"],"a":1,"n":""},{"q":"The second condition of equilibrium is represented by:","o":["∑τ = 0","∑F = 0","Both a & b","All of above"],"a":0,"n":""},{"q":"Sigma (∑) is the Greek letter used to represent:","o":["Addition","Subtraction","Multiplication","Division"],"a":0,"n":""},{"q":"A body is balanced if the sum of clockwise moments equals the sum of anticlockwise moments. This is the:","o":["principle of moments","principle of inertia","principle of equilibrium","all of these"],"a":0,"n":""},{"q":"Clockwise torque is taken as:","o":["Positive","Negative","Both a and b","All of these"],"a":1,"n":""},{"q":"Anticlockwise torque is taken as:","o":["Positive","Negative","Both a and b","All of these"],"a":0,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 7 – Centre of Gravity","q":[{"q":"The force acting perpendicularly downwards towards the earth is called:","o":["Torque","Weight","Force of gravity","Both B & C"],"a":3,"n":""},{"q":"The point at which the whole weight of the body appears to act is called:","o":["Origin","Couple","Centre of Gravity","Reference point"],"a":2,"n":""},{"q":"The position of the centre of gravity depends upon:","o":["Size of the body","Shape of the body","Weight of the body","Force of the body"],"a":1,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 8 – States of Equilibrium","q":[{"q":"How many states of equilibrium are there?","o":["1","2","3","4"],"a":2,"n":""},{"q":"Four solid uniform cones of equal weight are placed on a bench (diagram in your PDF). Which cone is the most stable?","o":["A","B","C","D"],"a":2,"n":""},{"q":"The equilibrium in which the body comes back to its original condition when set free after slightly lifting from one side is:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of above"],"a":0,"n":""},{"q":"The equilibrium in which the body does not come back to its original condition when set free after slightly lifting from one side is:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of above"],"a":1,"n":""},{"q":"The equilibrium in which, after disturbance, the body again comes to rest and the centre of gravity remains unchanged is:","o":["Stable","Unstable","Neutral","None of above"],"a":2,"n":""},{"q":"In stable equilibrium, the centre of gravity compared with the original position is:","o":["Raised","Lowered","Remain the same","All of above"],"a":0,"n":""},{"q":"In unstable equilibrium, the centre of gravity compared with the original position is:","o":["Raised","Lowered","Remain the same","All of above"],"a":1,"n":""},{"q":"In neutral equilibrium, the centre of gravity compared with the original position is:","o":["Raised","Lowered","Remain the same","All of above"],"a":2,"n":""},{"q":"The diagram shows a children’s wooden play tower. Which change makes it more stable?","o":["Making the tower narrower","Making the tower taller","Lowering the centre of mass","Raising the centre of mass"],"a":2,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 9 – Circular Motion and Centripetal Force","q":[{"q":"In circular motion, the motion of every particle of the body is:","o":["Different","Opposite","Same","None of these"],"a":2,"n":""},{"q":"The force which compels a body to move in a circle is:","o":["Centripetal force","Centrifugal force","Perpendicular force","Tension"],"a":0,"n":""},{"q":"If the velocity of a body moving in a circle is doubled, its centripetal force becomes:","o":["Double","Half","Four times","Remains the same"],"a":2,"n":""},{"q":"The centripetal acceleration is always along:","o":["Normal forces","Centripetal force","Mass","Horizontal force"],"a":1,"n":""},{"q":"If the centripetal force on a body is doubled, its velocity will become:","o":["Double","1.4 times","Half","Four times"],"a":1,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 10 – Exercise MCQs (4.1 to 4.6)","q":[{"q":"A particle is acted upon by two forces of 4 N and 3 N at the same time. The net force on the particle is:","o":["1 N","Between 1 N and 7 N","5 N","7 N"],"a":1,"n":""},{"q":"A force F makes an angle of 60° with the x-axis. Its y-component is equal to:","o":["F","F sin 60°","F cos 60°","F tan 60°"],"a":1,"n":""},{"q":"Moment of force is called:","o":["Moment arm","Couple","Couple arm","Torque"],"a":3,"n":""},{"q":"If F1 and F2 act on a body and τ is the torque produced, the body is completely in equilibrium when:","o":["∑F = 0 and ∑τ = 0","∑F = 0 and ∑τ ≠ 0","∑F ≠ 0 and ∑τ = 0","∑F ≠ 0 and ∑τ ≠ 0"],"a":0,"n":""},{"q":"A shopkeeper sells articles using a balance with unequal arms. If he puts the weights in the pan with the shorter arm, the customer:","o":["Loses","Gains","Neither loses nor gains","Not certain"],"a":0,"n":""},{"q":"A man walks on a tight rope and balances himself by holding a bamboo stick horizontally. This is an application of:","o":["Law of conservation of momentum","Newton’s second law of motion","Principle of moments","Newton’s third law of motion"],"a":2,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 11 – Exercise MCQs (4.7 to 4.10)","q":[{"q":"In stable equilibrium the centre of gravity of the body lies:","o":["At the highest position","At the lowest position","At any position","Outside the body"],"a":1,"n":""},{"q":"The centre of mass of a body:","o":["Always lies inside the body","Always lies outside the body","Always lies on the surface of the body","May lie within, outside or on the surface"],"a":3,"n":""},{"q":"A cylinder resting on its circular base is in:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of these"],"a":0,"n":""},{"q":"Centripetal force is given by:","o":["rF","rF cos θ","mv²/r","mv/r"],"a":2,"n":""}]},{"sid":"phy","t":"Turning Effect of Force · Page 12 – Equilibrium and Stability","q":[{"q":"When an object rests on a smooth horizontal surface, its weight is balanced by:","o":["Normal reaction","Torque","Friction","Couple"],"a":0,"n":""},{"q":"A metre rod on a wedge is an example of:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of above"],"a":1,"n":""},{"q":"A book lying on a table is an example of:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of above"],"a":0,"n":""},{"q":"Motion of a football on the ground is an example of:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of above"],"a":2,"n":""},{"q":"Which of a racing car is kept low to make it stable?","o":["Width","Height","Length","Weight"],"a":1,"n":""},{"q":"If the centre of gravity of a body is below the fulcrum, the body is in:","o":["Stable equilibrium","Unstable equilibrium","Neutral equilibrium","None of above"],"a":0,"n":""},{"q":"The torque in a ceiling fan rotating at constant speed is:","o":["1","2","0","Maximum"],"a":2,"n":""},{"q":"An object’s stability can be improved by:","o":["Lowering the centre of mass","Increasing the area of support","Both","None of these"],"a":2,"n":""},{"q":"A body is said to be in equilibrium if:","o":["Its velocity is not changing","Its acceleration is uniform","Its velocity is changing","Its acceleration is not uniform"],"a":0,"n":""}]},{"sid":"phy","t":"Chapter 1 · Physical Quantities and Measurements · Exercise MCQs","q":[{"q":"The instrument that is most suitable for measuring the thickness of a few sheets of cardboard is a:","o":["metre rule","measuring tape","Vernier Callipers","micrometer screw gauge"],"a":3,"n":"Ex 1.1 · A micrometer screw gauge has a least count of 0.01 mm, making it most suitable for measuring the small thickness of a few sheets of cardboard"},{"q":"One femtometre is equal to:","o":["10⁻⁹ m","10⁻¹⁵ m","10⁹ m","10¹⁵ m"],"a":1,"n":"Ex 1.2 · From Table 1.4, the prefix femto (f) represents 10⁻¹⁵"},{"q":"Which one is a non-physical quantity?","o":["distance","density","colour","temperature"],"a":2,"n":"Ex 1.4 · Colour depends on observer perception and is a non-physical quantity, unlike distance, density, and temperature"},{"q":"When using a measuring cylinder, one precaution to take is to:","o":["check for the zero error","look at the meniscus from below the level of the water surface","take several readings by looking from more than one direction","position the eye in line with the bottom of the meniscus"],"a":3,"n":"Ex 1.5 · For water (concave meniscus), the eye must be kept level with the bottom edge of the meniscus"},{"q":"A displacement can is used to measure:","o":["mass of a liquid","mass of a solid","volume of a liquid","volume of a solid"],"a":3,"n":"Ex 1.7 · A displacement (overflow) can measures the volume of an irregular or large solid by water displacement"},{"q":"Four students measure the diameter of a cylinder with Vernier Callipers. Which of the following readings is correct?","o":["3.4 cm","3.475 cm","3.47 cm","3.5 cm"],"a":2,"n":"Ex 1.9 · Standard Vernier Callipers have a least count of 0.1 mm = 0.01 cm, so readings are recorded to two decimal places in cm (3.47 cm)"},{"q":"Which of the following measures are likely to represent the thickness of a sheet of this book?","o":["6 × 10⁻²⁵ m","1 × 10⁻⁴ m","1.2 × 10⁻¹⁵ m","4 × 10⁻² m"],"a":1,"n":"Ex 1.10 · From \"Do You Know?\" on p. 12, the thickness of a book page is 1.0 × 10⁻⁴ m"}],"m":1},{"sid":"phy","t":"Chapter 1 · Physical Quantities and Measurements · Short-question MCQs","q":[{"q":"Can a non-physical quantity be measured with a physical instrument, and how is it evaluated?","o":["Yes, directly using digital meters","No, it cannot be measured with instruments; it is described qualitatively or compared via criteria, indices, or surveys","Yes, by comparing it with SI base units","No, it cannot be described or compared in any way"],"a":1,"n":"SQ 1.1 · Non-physical quantities cannot be measured with instruments; they are described qualitatively or compared via criteria, indices, or surveys"},{"q":"A measurement is a process of comparing an unknown quantity with a widely accepted standard, and it consists of which two parts?","o":["A symbol and a prefix","A number (magnitude) and a unit","A scale and a pointer","A base quantity and a derived quantity"],"a":1,"n":"SQ 1.2 · Measurement compares an unknown quantity with a standard and consists of a number (magnitude) and a unit"},{"q":"Why do we need a standard unit for measurements?","o":["Because physical quantities have no numerical values","To avoid confusion so measurements taken by different people or countries remain uniform and reliable","To replace all derived quantities with base quantities","Because instruments only work with metric prefixes"],"a":1,"n":"SQ 1.3 · Standard units prevent confusion across different people and countries and enable reliable scientific and trade exchange"},{"q":"Which group correctly lists three base quantities followed by three derived quantities?","o":["Base: speed, area, volume — Derived: length, mass, time","Base: length, mass, time — Derived: speed, area, volume","Base: force, pressure, charge — Derived: temperature, electric current, mass","Base: length, force, time — Derived: mass, speed, density"],"a":1,"n":"SQ 1.4 · Length, mass, and time are SI base quantities; speed, area, and volume are derived quantities"},{"q":"Which of the following correctly lists all seven SI base units and their symbols?","o":["metre (m), gram (g), second (s), kelvin (K), ampere (A), candela (cd), mole (mol)","metre (m), kilogram (kg), second (s), kelvin (K), ampere (A), candela (cd), mole (mol)","metre (m), kilogram (kg), second (s), celsius (°C), ampere (A), watt (W), mole (mol)","kilometre (km), kilogram (kg), second (s), kelvin (K), volt (V), candela (cd), mole (mol)"],"a":1,"n":"SQ 1.6 · Table 1.2 lists the 7 SI base units: metre (m), kilogram (kg), second (s), kelvin (K), ampere (A), candela (cd), and mole (mol)"},{"q":"Why are prefixes used with SI units, and which option shows three sub-multiple prefixes and three multiple prefixes?","o":["To avoid units; Sub-multiples: kilo, mega, giga; Multiples: milli, centi, micro","To express very large or very small quantities conveniently; Sub-multiples: milli (m), micro (μ), nano (n); Multiples: kilo (k), mega (M), giga (G)","To convert vectors to scalars; Sub-multiples: deci (d), kilo (k), tera (T); Multiples: pico (p), femto (f), atto (a)","To eliminate zero errors; Sub-multiples: mega (M), giga (G), peta (P); Multiples: centi (c), milli (m), micro (μ)"],"a":1,"n":"SQ 1.7 · Prefixes simplify writing very large or small powers of 10; milli (10⁻³), micro (10⁻⁶), nano (10⁻⁹) are sub-multiples, while kilo (10³), mega (10⁶), giga (10⁹) are multiples"}],"m":1},{"sid":"phy","t":"Chapter 2 · Kinematics · Exercise MCQs","q":[{"q":"The numerical ratio of displacement to distance is:","o":["always less than one","always equal to one","always greater than one","equal to or less than one"],"a":3,"n":"Ex 2.1 · Magnitude of displacement is the shortest straight-line path, so it is always equal to (straight line) or less than (curved path) total distance"},{"q":"If a body does not change its position with respect to some fixed point, then it will be in a state of:","o":["rest","motion","uniform motion","variable motion"],"a":0,"n":"Ex 2.2 · A body that does not change its position with respect to its surroundings is at rest"},{"q":"A ball is dropped from the top of a tower; the distance covered by it in the first second is:","o":["5 m","10 m","50 m","100 m"],"a":0,"n":"Ex 2.3 · Using S = vit + ½gt² with vi = 0, g = 10 m s⁻², and t = 1 s gives S = 0 + ½(10)(1)² = 5 m"},{"q":"A body accelerates from rest to a velocity of 144 km h⁻¹ in 20 seconds. The distance covered by it is:","o":["100 m","400 m","1400 m","1440 m"],"a":1,"n":"Ex 2.4 · vf = 144 km h⁻¹ = 40 m s⁻¹. Average speed = (0 + 40)/2 = 20 m s⁻¹. Distance S = 20 × 20 = 400 m"},{"q":"The area under the speed-time graph is numerically equal to:","o":["velocity","uniform velocity","acceleration","distance covered"],"a":3,"n":"Ex 2.7 · The area under a speed-time graph up to the time axis equals the distance covered"}],"m":1},{"sid":"phy","t":"Chapter 2 · Kinematics · Short-question MCQs","q":[{"q":"Which statement accurately distinguishes between a scalar quantity and a vector quantity?","o":["A scalar requires magnitude and direction, while a vector requires magnitude only.","A scalar is completely described by magnitude only, while a vector requires both magnitude and direction.","Both scalars and vectors require direction for complete description.","Scalars cannot be added arithmetically, whereas vectors can be added like ordinary numbers."],"a":1,"n":"SQ 2.1 · Scalars need magnitude only; vectors require both magnitude and direction"},{"q":"Which of the following sets consists entirely of scalar quantities?","o":["Mass, distance, time, speed, temperature","Distance, displacement, speed, energy, time","Velocity, force, acceleration, weight, momentum","Mass, energy, temperature, velocity, length"],"a":0,"n":"SQ 2.2 · Mass, distance, time, speed, and temperature are all scalar quantities"},{"q":"Which of the following sets consists entirely of vector quantities?","o":["Speed, mass, energy, time, temperature","Displacement, velocity, acceleration, force, weight","Distance, velocity, force, time, weight","Acceleration, energy, displacement, speed, force"],"a":1,"n":"SQ 2.2 · Displacement, velocity, acceleration, force, and weight all have both magnitude and direction"},{"q":"According to the head-to-tail rule for adding vectors, how is the resultant vector drawn?","o":["From the head of the first vector to the tail of the last vector","From the tail of the first vector to the head of the last vector","By joining the tails of all vectors together","By joining the heads of all vectors together"],"a":1,"n":"SQ 2.3 · By the head-to-tail rule, the resultant vector runs from the tail of the first vector to the head of the last vector"},{"q":"Which pair of quantities is plotted on the axes of a distance-time graph and a speed-time graph respectively?","o":["Distance on x-axis, time on y-axis; speed on x-axis, time on y-axis","Time on x-axis and distance on y-axis; time on x-axis and speed on y-axis","Acceleration on x-axis and time on y-axis for both graphs","Speed on y-axis and distance on x-axis for both graphs"],"a":1,"n":"SQ 2.4 · Independent variable time (t) is plotted on the x-axis, while dependent variables distance (S) or speed (v) are plotted on the y-axis"},{"q":"Falling objects near the Earth have the same constant free-fall acceleration (g = 10 m s⁻²). In the absence of air resistance, does a heavier object fall faster than a lighter object?","o":["Yes, because gravitational pull is greater on heavier mass.","Yes, because heavier objects have less inertia.","No, both fall with the same acceleration and reach the ground simultaneously.","No, the lighter object always falls faster than the heavier object."],"a":2,"n":"SQ 2.5 · In a vacuum (without air resistance), light and heavy objects fall side by side with the same free-fall acceleration g = 10 m s⁻²"}],"m":1},{"sid":"phy","t":"Chapter 3 · Dynamics · Exercise MCQs","q":[{"q":"When we kick a stone, we get hurt. This is due to:","o":["inertia","velocity","momentum","reaction"],"a":3,"n":"Ex 3.1 · By Newton's third law, when we kick a stone (action), the stone exerts an equal and opposite reaction force on our foot"},{"q":"An object will continue its motion with constant acceleration until:","o":["the resultant force on it begins to decrease.","the resultant force on it is zero.","the resultant force on it begins to increase.","the resultant force is at right angle to its tangential velocity."],"a":1,"n":"Ex 3.2 · Acceleration is proportional to net resultant force (F = ma). Constant acceleration continues until the resultant force becomes zero"},{"q":"Which of the following is a non-contact force?","o":["Friction","Air resistance","Electrostatic force","Tension in the string"],"a":2,"n":"Ex 3.3 · Electrostatic force acts at a distance between charged bodies without physical contact, whereas friction, air resistance, and tension are contact forces"},{"q":"A particle of mass m moving with a velocity v collides with another particle of the same mass at rest. The velocity of the first particle after collision is:","o":["v","−v","0","−1/2"],"a":2,"n":"Ex 3.5 · In an elastic head-on collision between two identical masses where the second is at rest, there is a total transfer of momentum and the first particle comes to rest (v₁′ = 0)"},{"q":"Conservation of linear momentum is equivalent to:","o":["Newton's first law of motion","Newton's second law of motion","Newton's third law of motion","None of these"],"a":2,"n":"Ex 3.6 · During interaction in an isolated system, equal and opposite action-reaction forces (Newton's third law) produce equal and opposite changes in momentum"},{"q":"A lubricant is usually introduced between two surfaces to decrease friction. The lubricant:","o":["decreases temperature","acts as ball bearings","prevents direct contact of the surfaces","provides rolling friction"],"a":2,"n":"Ex 3.9 · A lubricant forms a fluid layer that prevents direct contact between solid surfaces, reducing friction"}],"m":1},{"sid":"phy","t":"Chapter 3 · Dynamics · Short-question MCQs","q":[{"q":"What kind of changes in motion may be produced by a force acting on a body?","o":["It can only increase the mass of the body.","It can start, stop, or change the magnitude and direction of velocity of a body.","It can only change the color and temperature of a body.","It keeps a moving body at constant velocity without any change."],"a":1,"n":"SQ 3.1 · A force is a push or pull that starts, stops, or changes the magnitude and direction of velocity of a body"},{"q":"Which of the following lists contains ONLY contact forces?","o":["Friction, drag, normal force, tension force, elastic force","Gravitational force, magnetic force, electrostatic force, friction, drag","Thrust, air resistance, strong nuclear force, normal force, tension","Weight, electrostatic force, magnetic force, elastic force, friction"],"a":0,"n":"SQ 3.2 · Friction, drag, thrust, normal force, air resistance, tension, and elastic force are all contact forces"},{"q":"If an object moves with constant velocity in free space (where no external force acts on it), how long will it continue to move with this velocity?","o":["Until its initial kinetic energy runs out","For a few minutes before slowing down","Forever, unless acted upon by an external force","Only until it travels a distance equal to its mass"],"a":2,"n":"SQ 3.3 · In free space where no external force acts, an object continues moving forever with constant velocity"},{"q":"How is the impulse of a force defined?","o":["The ratio of force to time interval (F / Δt)","The product of a large force and the short time interval (F × Δt), equal to total change in momentum","The product of mass and acceleration per unit distance","The difference between initial and final velocities"],"a":1,"n":"SQ 3.4 · Impulse is defined as F × Δt = mΔv, the total change in momentum of the object"},{"q":"Why is Newton's first law of motion not directly observed to continue indefinitely for moving bodies on the Earth?","o":["Because Earth's atmosphere has no gravity","Because opposing forces like friction and air resistance always act on moving objects to stop them","Because objects lose mass while moving on Earth","Because Newton's first law only applies to stationary objects"],"a":1,"n":"SQ 3.5 · On Earth, opposing forces like friction and air resistance act on moving bodies and bring them to rest"},{"q":"When sitting in a car that suddenly accelerates forward from rest, you are pushed back against the seat because:","o":["an external backward force pulls you toward the rear","of inertia, as your body tends to retain its initial state of rest","air pressure inside the car increases suddenly","your weight increases due to acceleration"],"a":1,"n":"SQ 3.6 · Due to inertia, the passenger's body tends to maintain its state of rest while the car moves forward"},{"q":"What is the terminal velocity of a falling object?","o":["The initial velocity with which an object is thrown downward","The maximum acceleration reached just before hitting the ground","The constant velocity achieved when upward air resistance balances downward gravitational force","The velocity of an object falling in a complete vacuum"],"a":2,"n":"SQ 3.9 · Terminal velocity is the constant downward velocity attained when upward air resistance balances the downward force of gravity"}],"m":1},{"sid":"phy","t":"Chapter 4 · Turning Effects of Force · Exercise MCQs","q":[{"q":"A particle is simultaneously acted upon by two forces of 4 and 3 newtons. The net force on the particle is:","o":["1 N","between 1 N and 7 N","5 N","7 N"],"a":1,"n":"Ex 4.1 · When two forces of 4 N and 3 N act simultaneously at an unknown angle, their resultant ranges from a minimum of 4 N − 3 N = 1 N (opposite directions) to a maximum of 4 N + 3 N = 7 N (same direction)."},{"q":"A force F is making an angle of 60° with x-axis. Its y-component is equal to:","o":["F","F sin 60°","F cos 60°","F tan 60°"],"a":1,"n":"Ex 4.2 · The vertical (y) component of a force F making an angle θ with the x-axis is given by Fy = F sin θ = F sin 60°."}],"m":1},{"sid":"phy","t":"Chapter 4 · Turning Effects of Force · Short-question MCQs","q":[{"q":"Parallel forces that act in the same direction are called ______, whereas parallel forces acting in opposite directions are called ______.","o":["unlike parallel forces; like parallel forces","like parallel forces; unlike parallel forces","balanced forces; resultant forces","action forces; reaction forces"],"a":1,"n":"SQ 4.1 · Parallel forces acting in the same direction are like parallel forces, while those acting in opposite directions are unlike parallel forces."},{"q":"A force F makes an angle θ with the positive x-axis. What are the values of its two rectangular (perpendicular) components Fx and Fy?","o":["Fx = F sin θ, Fy = F cos θ","Fx = F tan θ, Fy = F cos θ","Fx = F cos θ, Fy = F sin θ","Fx = F / cos θ, Fy = F / sin θ"],"a":2,"n":"SQ 4.2 · Resolving a force F into two mutually perpendicular components along the x and y axes yields Fx = F cos θ and Fy = F sin θ."},{"q":"What is meant by the \"line of action of a force\"?","o":["The perpendicular distance from the pivot to the point of application","The straight line passing through the point of application along which the force acts","The circular path followed by a rotating rigid body","The axis passing through the centre of gravity of the body"],"a":1,"n":"SQ 4.3 · The straight line along which a force acts is defined as the line of action of the force."},{"q":"Moment of a force (torque) is defined as the product of the force and the moment arm. When a force F acts at a position vector r making an angle θ with r, the magnitude of torque is:","o":["τ = rF cos θ","τ = rF tan θ","τ = rF sin θ","τ = (F / r) sin θ"],"a":2,"n":"SQ 4.4 · The perpendicular component of force F is F sin θ (or moment arm r sin θ), giving torque τ = rF sin θ."},{"q":"Which of the following is an example of a body that is moving yet remains in a state of dynamic equilibrium?","o":["A stone falling freely from a cliff with increasing speed","A paratrooper descending downward with uniform terminal velocity","A car accelerating uniformly on a straight highway","A book lying stationary on a horizontal table"],"a":1,"n":"SQ 4.7 · A paratrooper descending at uniform velocity has zero acceleration because downward weight is balanced by upward air resistance, placing the body in dynamic equilibrium."}],"m":1},{"sid":"phy","t":"Chapter 5 · Work, Energy and Power · Exercise MCQs","q":[{"q":"Work done is maximum when the angle between the force F and the displacement d is:","o":["0°","30°","60°","90°"],"a":0,"n":"Ex 5.1 · W = FS cos θ; at θ = 0°, cos 0° = 1, giving maximum work W = FS"},{"q":"The SI unit of power is:","o":["joule","newton","watt","second"],"a":2,"n":"Ex 5.3 · The SI unit of power is watt (W), equal to 1 J s⁻¹"},{"q":"A bullet of mass 0.05 kg has a speed of 300 m s⁻¹. Its kinetic energy will be:","o":["2250 J","4500 J","1500 J","1125 J"],"a":0,"n":"Ex 5.5 · Ek = ½ mv² = ½ × 0.05 × (300)² = 0.025 × 90,000 = 2250 J"},{"q":"If a car doubles its speed, its kinetic energy will be:","o":["the same","doubled","increased to three times","increased to four times"],"a":3,"n":"Ex 5.6 · Ek ∝ v²; doubling speed (2v) increases kinetic energy by 2² = 4 times"},{"q":"If the magnitude of momentum of an object is doubled, the kinetic energy of the object will:","o":["double","increase to four times","reduce to one-half","remain the same"],"a":1,"n":"Ex 5.8 · Since p = mv, Ek = p² / (2m). Doubling momentum p increases Ek by 2² = 4 times"},{"q":"Which of the following is not a renewable energy source?","o":["Hydroelectric energy","Fossil fuels","Wind energy","Solar energy"],"a":1,"n":"Ex 5.9 · Fossil fuels (coal, oil, natural gas) take millions of years to form and are non-renewable"}],"m":1},{"sid":"phy","t":"Chapter 5 · Work, Energy and Power · Short-question MCQs","q":[{"q":"What is the work done on an object that remains at rest when a force is applied on it?","o":["Equal to the applied force","Maximum","Zero","Negative"],"a":2,"n":"SQ 5.1 · If displacement S = 0, then work done W = F × 0 = 0"},{"q":"How is it possible for a slow-moving car to have more kinetic energy than a fast-moving motorcycle?","o":["Because kinetic energy depends only on mass","Because the car has a much larger mass than the motorcycle","Because the car has greater gravitational potential energy","Because air resistance acts less on the car"],"a":1,"n":"SQ 5.2 · Ek = ½ mv² depends on both mass and speed; the car's much greater mass compensates for its lower speed"},{"q":"A woman runs up a flight of stairs and gains 4500 J of gravitational potential energy. If she runs up the same stairs with twice the speed, what will be her gain in potential energy?","o":["2250 J","4500 J","9000 J","18000 J"],"a":1,"n":"SQ 5.4 · Gravitational P.E. = mgh depends only on weight and vertical height, not on speed; thus it remains 4500 J"},{"q":"Work is defined as the product of magnitude of force and distance covered in the direction of force, and one joule is equal to:","o":["1 N m⁻¹","1 N s","1 N m","1 kg m s⁻²"],"a":2,"n":"SQ 5.5 · 1 joule = 1 newton × 1 metre = 1 N m"},{"q":"Which expression correctly gives the kinetic energy (Ek) of a body of mass m moving with velocity v?","o":["mv²","½ mv²","½ m²v","2mv²"],"a":1,"n":"SQ 5.7 · Kinetic energy of a moving body is given by Ek = ½ mv²"},{"q":"Why can a practical working system never have 100% efficiency?","o":["Input energy is always less than output energy","Some input energy is inevitably wasted as heat due to friction","Gravitational potential energy destroys mechanical energy","Power cannot be converted into work"],"a":1,"n":"SQ 5.8 · In every real machine, part of the input energy is unavoidably wasted as heat due to friction"},{"q":"Power is defined as the time rate of doing work, and one watt is equal to:","o":["1 J s","1 N s⁻¹","1 J s⁻¹","1 kg m s⁻²"],"a":2,"n":"SQ 5.9 · Power is P = W / t, and 1 watt = 1 J / 1 s = 1 J s⁻¹"}],"m":1},{"sid":"phy","t":"Chapter 6 · Mechanical Properties of Matter · Exercise MCQs","q":[{"q":"A wire is stretched by a weight w. If the diameter of the wire is reduced to half of its previous value, the extension will become:","o":["one half","double","one fourth","four times"],"a":3,"n":"Ex 6.1 · Cross-sectional area A = πd²/4. Halving diameter d reduces area to 1/4, making extension 4 times greater for the same load"},{"q":"Two metal plates of area 2 and 3 square metres are placed horizontally in a liquid at the same depth. The ratio of pressures on the two plates is:","o":["1 : 1","√2 : √3","2 : 3","4 : 9"],"a":0,"n":"Ex 6.3 · Liquid pressure P = ρgh depends only on depth and density, not plate area; at equal depth, ratio is 1 : 1"},{"q":"The principle of a hydraulic press is based on:","o":["Hooke's law","Pascal's law","Principle of conservation of energy","Principle of conservation of momentum"],"a":1,"n":"Ex 6.6 · A hydraulic press operates as a force multiplier based on Pascal's law"},{"q":"When a spring is compressed, what form of energy does it possess?","o":["Kinetic","Potential","Internal","Heat"],"a":1,"n":"Ex 6.7 · A compressed or stretched spring stores elastic potential energy"},{"q":"What is the force exerted by the atmosphere on a rectangular block surface of length 50 cm and breadth 40 cm? The atmospheric pressure is 100 kPa.","o":["20 kN","100 kN","200 kN","500 kN"],"a":0,"n":"Ex 6.8 · A = 0.50 m × 0.40 m = 0.20 m²; F = P × A = 100,000 Pa × 0.20 m² = 20,000 N = 20 kN"}],"m":1},{"sid":"phy","t":"Chapter 6 · Mechanical Properties of Matter · Short-question MCQs","q":[{"q":"Why do heavy animals like an elephant have a large foot area?","o":["To increase pressure on the ground for better grip","To spread their large weight over a bigger contact area and reduce pressure","To increase their running speed","To decrease their gravitational mass"],"a":1,"n":"SQ 6.1 · Since P = F / A, a larger foot area distributes the elephant's heavy weight and lowers ground pressure"},{"q":"Why is it painful to walk barefoot on pebbles?","o":["Pebbles increase the contact area of the foot","Pebbles reduce the contact area, greatly increasing the upward reaction pressure on the feet","Pebbles absorb heat from the feet","Pebbles increase the body's weight"],"a":1,"n":"SQ 6.3 · Walking on pebbles reduces the contact area under the foot, creating high, painful reaction pressure"},{"q":"According to Pascal's law, when pressure is applied at one point in an enclosed fluid, it is transmitted equally without loss, which is applied in a:","o":["Mercury barometer","Spring balance","Hydraulic press or car lift","Thermocouple thermometer"],"a":2,"n":"SQ 6.4 · Pascal's law states that pressure applied at one point in an enclosed fluid is transmitted equally without loss; used in hydraulic presses, car lifts, and hydraulic brakes"},{"q":"What is meant by the elasticity of a solid?","o":["The permanent change in shape when a force is applied","The property of restoring its original size and shape after the deforming force is removed","The mass per unit volume of the solid","The resistance offered by the solid to heat flow"],"a":1,"n":"SQ 6.5 · Elasticity is the property of a material to regain its original size and shape once the deforming force is removed"},{"q":"Which statement correctly distinguishes force from pressure?","o":["Force is a scalar measured in Pa; pressure is a vector measured in N","Force is a push or pull (unit: N); pressure is the normal force acting per unit area (unit: Pa)","Force depends on area; pressure is independent of area","Both have the same SI unit of N m⁻²"],"a":1,"n":"SQ 6.7 · Force is a vector agent (unit: N), whereas pressure is normal force per unit area (P = F / A, unit: Pa = N m⁻²)"},{"q":"What is the relationship between liquid pressure (P) and the depth (h) of a liquid of density ρ?","o":["Pressure is inversely proportional to depth (P = ρg / h)","Pressure is independent of depth","Pressure is directly proportional to depth (P = ρgh)","Pressure decreases linearly with depth"],"a":2,"n":"SQ 6.8 · Liquid pressure increases directly with depth according to P = ρgh"},{"q":"State the basic principle used in the hydraulic brake system of automobiles:","o":["Hooke's law","Pascal's law","Principle of moments","Conservation of momentum"],"a":1,"n":"SQ 6.10 · Automobile hydraulic brake systems operate on Pascal's law to transmit brake-pedal pressure equally to all wheel cylinders"}],"m":1},{"sid":"phy","t":"Chapter 7 · Thermal Properties of Matter · Exercise MCQs","q":[{"q":"Temperature of a substance is:","o":["the total amount of heat contained in it","the total number of molecules in it","degree of hotness or coldness","dependent upon the intermolecular distance"],"a":2,"n":"Ex 7.3 · Temperature of a body is defined as the degree of its hotness or coldness"},{"q":"Heat is the:","o":["total kinetic energy of the molecules","the internal energy","work done by the molecules","the energy in transit"],"a":3,"n":"Ex 7.4 · Heat is energy in transit from a hotter body to a colder body due to a difference in temperature"},{"q":"In Kelvin scale, the temperature corresponding to melting point of ice is:","o":["zero","32","−273","+273"],"a":3,"n":"Ex 7.5 · On the Kelvin scale, the lower fixed point (melting point of pure ice, 0°C) is +273 K"},{"q":"The temperature which has the same value on Celsius and Fahrenheit scale is:","o":["−40","+40","+45","−45"],"a":0,"n":"Ex 7.6 · Setting TF = TC in TF = (9/5)TC + 32 gives −40°C = −40°F"},{"q":"One disadvantage of using alcohol in a liquid-in-glass thermometer is that:","o":["it has large expansivity","it has low freezing point (−112°C)","it wets the glass tube","its expansion is linear"],"a":2,"n":"Ex 7.8 · Unlike mercury, alcohol wets the inner wall of the glass tube (and has a low boiling point of 78°C)"},{"q":"Water is not used as a thermometric liquid mainly due to:","o":["being colourless","being a bad conductor of heat","non-linear expansion","a low boiling point (100°C)"],"a":2,"n":"Ex 7.9 · Water has non-linear thermal expansion (anomalous expansion between 0°C and 4°C), making it unsuitable for thermometers"}],"m":1},{"sid":"phy","t":"Chapter 7 · Thermal Properties of Matter · Short-question MCQs","q":[{"q":"What is the effect of raising the temperature of a liquid on its molecules?","o":["Molecular motion slows down and volume decreases","Average kinetic energy of molecules increases and the liquid expands","Intermolecular forces become infinitely strong","Molecules become locked in fixed lattice positions"],"a":1,"n":"SQ 7.4 · Heating a liquid increases the average kinetic energy of its molecules, causing faster motion and thermal expansion"},{"q":"According to molecular theory, temperature of a body is a measure of:","o":["total potential energy of all molecules","total mass of the molecules","average kinetic energy of its molecules","total heat stored inside the body"],"a":2,"n":"SQ 7.5 · According to kinetic molecular theory, temperature is a measure of the average kinetic energy of the molecules of an object"},{"q":"Which of the following is a thermometric property used to measure temperature?","o":["Thermal expansion of a liquid","Electrical resistance of a wire","Thermoelectric current in a thermocouple","All of the above"],"a":3,"n":"SQ 7.7 · Thermal expansion of liquids, electrical resistance of wires, gas pressure, and thermoelectric current all vary predictably with temperature"},{"q":"What are the three main scales used for measuring temperature?","o":["Celsius, Fahrenheit, and Kelvin","Celsius, Joule, and Pascal","Kelvin, Newton, and Watt","Fahrenheit, Rankine, and Ampere"],"a":0,"n":"SQ 7.8 · The three main temperature scales are Celsius (centigrade), Fahrenheit, and Kelvin (absolute) scales"},{"q":"What determines the direction of net heat flow between two bodies in thermal contact?","o":["Their difference in mass","Their difference in volume","Their difference in temperature","Their difference in density"],"a":2,"n":"SQ 7.12 · Temperature difference determines the direction of heat flow, which always moves spontaneously from higher to lower temperature"},{"q":"How does internal energy differ from heat?","o":["Internal energy is the sum of molecular kinetic and potential energies in a body, whereas heat is energy in transit due to temperature difference","Heat is contained inside a body, whereas internal energy only flows between bodies","Internal energy is measured in watts, whereas heat is measured in kelvins","There is no physical difference between internal energy and heat"],"a":0,"n":"SQ 7.13 · A substance contains internal energy (sum of molecular KE + PE), whereas heat is energy transferred between bodies due to temperature difference"}],"m":1},{"sid":"phy","t":"Chapter 8 · Magnetism · Exercise MCQs","q":[{"q":"Which one of the following is not a magnetic material?","o":["Cobalt","Iron","Aluminium","Nickel"],"a":2,"n":"Ex 8.1 · Iron, nickel, and cobalt are ferromagnetic magnetic materials, whereas aluminium is not attracted by a magnet"},{"q":"Magnetic lines of force:","o":["are always directed in a straight line","cross one another","enter into the north pole","enter into the south pole"],"a":3,"n":"Ex 8.2 · Outside a magnet, magnetic field lines originate from the north pole and enter into the south pole without crossing"},{"q":"A common method used to magnetise a material is:","o":["stroking","hitting","heating","placing inside a solenoid having A.C"],"a":0,"n":"Ex 8.5 · Stroking with a permanent magnet (or placing in a DC solenoid) magnetises steel; hitting, heating, and AC solenoids demagnetise magnets"}],"m":1},{"sid":"phy","t":"Chapter 8 · Magnetism · Short-question MCQs","q":[{"q":"How do temporary magnets differ from permanent magnets?","o":["Temporary magnets work only in the presence of an external magnetic field, whereas permanent magnets retain their magnetism indefinitely","Temporary magnets have only one pole, whereas permanent magnets have two poles","Temporary magnets are made of steel, whereas permanent magnets are made of soft iron","Temporary magnets repel all metals, whereas permanent magnets attract wood"],"a":0,"n":"SQ 8.1 · Temporary magnets (e.g., soft iron, electromagnets) act as magnets only while in a magnetic field, whereas permanent magnets (e.g., steel, alnico) keep their magnetism"},{"q":"What is the magnetic field of a magnet?","o":["The physical core inside a bar magnet","The region around a magnet where another magnetic object or pole experiences a magnetic force","The insulated copper wire wrapped around an iron nail","The neutral point where magnetic force is zero"],"a":1,"n":"SQ 8.2 · A magnetic field is the region around a magnet in which another magnetic material or pole experiences a magnetic force"},{"q":"What are magnetic lines of force?","o":["Imaginary lines around a magnet showing the path along which a free north magnetic pole moves","Electric wires carrying alternating current","Lines connecting two identical magnetic poles that intersect at right angles","Cracks formed inside a hammered steel bar"],"a":0,"n":"SQ 8.3 · Magnetic lines of force are curved lines around a magnet indicating the direction of force on a free N-pole (from N to S outside the magnet)"},{"q":"Which pair correctly matches a permanent magnet application and an electromagnet application?","o":["Permanent magnet: scrapyard crane; Electromagnet: refrigerator door strip","Permanent magnet: moving-coil loudspeaker; Electromagnet: circuit breaker and electric bell","Permanent magnet: magnetic relay; Electromagnet: magnetic compass needle","Permanent magnet: maglev propulsion coil; Electromagnet: maximum-minimum thermometer pointer"],"a":1,"n":"SQ 8.4 · Permanent magnets are used in loudspeakers, motors, and door catches; electromagnets are used in circuit breakers, relays, bells, and cranes"}],"m":1},{"sid":"phy","t":"Chapter 9 · Nature of Science · Exercise MCQs","q":[{"q":"Physics is a branch of:","o":["social science","life science","physical science","biological science"],"a":2,"n":"Ex 9.1 · Natural science is divided into biological sciences and physical sciences; Physics is a fundamental branch of physical science"},{"q":"Which branch of science plays a vital role in technology and engineering?","o":["Biology","Chemistry","Geology","Physics"],"a":3,"n":"Ex 9.2 · Physics provides the core laws and principles underlying modern technology and engineering"},{"q":"Automobile technology is based on:","o":["acoustics","electromagnetism","optics","thermodynamics"],"a":3,"n":"Ex 9.3 · Automobile heat engines operate on the principles of thermodynamics"},{"q":"What is the ultimate step/outcome of a scientific method?","o":["Hypothesis","Experimentation","Theory","Law"],"a":3,"n":"Ex 9.6 · In the scientific method flowchart, repeated verification of a theory leads to a scientific law"},{"q":"Which of the following are methods of investigation?","o":["Observation","Experimentation","Research","All of these"],"a":3,"n":"Ex 9.8 · Observation, experimentation, and research are all core methods of scientific investigation"},{"q":"A hypothesis:","o":["may or may not be testable","is supported by evidence","is a possible answer to a question","all of these"],"a":2,"n":"Ex 9.9 · A hypothesis is a proposed explanation or possible answer to a scientific question that can be tested by experiments"},{"q":"A graph of organized data is an example of:","o":["collecting data","forming a hypothesis","asking a question","analyzing data"],"a":3,"n":"Ex 9.10 · Plotting and interpreting graphs of organized data is part of analyzing data to draw conclusions"}],"m":1},{"sid":"phy","t":"Chapter 9 · Nature of Science · Short-question MCQs","q":[{"q":"What is science, and what are its two main groups?","o":["Collective knowledge about natural phenomena; divided into biological sciences and physical sciences","The study of historical literature; divided into prose and poetry","Engineering design of machines; divided into civil and mechanical engineering","Untestable beliefs about nature; divided into myths and legends"],"a":0,"n":"SQ 9.1 · Science is collective knowledge of natural phenomena, classified into bi
