ological sciences (living things) and physical sciences (non-living things)"},{"q":"What is Physics all about, and which of the following are its branches?","o":["Study of living organisms; branches include botany and zoology","Study of matter, energy, space, time, and their mutual interactions; branches include mechanics, optics, and electromagnetism","Study of ancient rocks and fossils; branches include mineralogy and paleontology","Study of human societies; branches include economics and sociology"],"a":1,"n":"SQ 9.2 · Physics studies matter, energy, space, time, and their interactions; its branches include mechanics, heat, acoustics, optics, and electromagnetism"},{"q":"What is the correct sequence of main steps in the scientific method?","o":["Law → Theory → Hypothesis → Observation","Observation → Hypothesis → Experiment → Theory → Prediction → Law","Prediction → Law → Observation → Experiment","Experiment → Law → Hypothesis → Observation"],"a":1,"n":"SQ 9.4 · The scientific method follows: Observation → Hypothesis → Experiment → Theory → Prediction → Law"},{"q":"What is a hypothesis?","o":["A proven universal law that can never be questioned","A proposed explanation or testable educated guess based on observations","A piece of laboratory measuring equipment","A final numerical graph printed in a textbook"],"a":1,"n":"SQ 9.5 · A hypothesis is a tentative, testable explanation or educated guess formulated from observations"},{"q":"How does a theory differ from a law in Physics?","o":["A theory is a logical explanation of causes and effects verified by experiments, whereas a law is a repeatedly tested statement describing consistent natural behaviour","A theory is always false, whereas a law is an untested guess","A theory applies only to biology, whereas a law applies only to chemistry","A theory cannot be tested experimentally, whereas a law requires no evidence"],"a":0,"n":"SQ 9.6 · A theory logically explains causes and effects of natural phenomena after experimental verification, while a law states a consistently tested pattern of nature"}],"m":1},{"sid":"quran","t":"سورۃ الشعراء","q":[{"q":"سورۃ الشعراء ہے:","o":["مکی","مدنی","قرآن کی زینت","آخری مدنی سورت"],"a":0,"n":""},{"q":"سورۃ الشعراء کی آیات ہیں:","o":["240","220","227","225"],"a":2,"n":""},{"q":"مکہ مکرمہ میں نازل ہونے والی طویل ترین سورت ہے:","o":["سورۃ البقرہ","سورۃ طٰہٰ","سورۃ الشعراء","سورۃ الفرقان"],"a":2,"n":""},{"q":"سورۃ الشعراء میں بیان کی گئی ہیں:","o":["اچھے لوگوں کی نشانیاں","رحمان کے بندوں کی نشانیاں","اچھے اور برے شاعروں کی نشانیاں","جنت اور جہنم کے احوال کی نشانیاں"],"a":2,"n":""},{"q":"سورۃ الشعراء کا آغاز ہوتا ہے:","o":["حضرت محمد رسول اللہ خاتم النبیین ﷺ کو تسلی دینے سے","حضرت محمد رسول اللہ خاتم النبیین ﷺ پر ایمان لانے سے","مشرکین کے اعتراضات کا جواب دے کر","شاعروں کی صفات سے"],"a":0,"n":""},{"q":"حضرت محمد خاتم النبیین ﷺ اور صحابہ کرام رضی اللہ تعالیٰ عنہم کو تسلی دی گئی کہ ایک دن کامیاب ہوں گے:","o":["اہل مکہ","اہل مدینہ","اہل ایمان","نافرمان لوگ"],"a":2,"n":""},{"q":"قرآن مجید کو آپ خاتم النبیین ﷺ کے قلب پر اتارا گیا:","o":["حضرت عزرائیل علیہ السلام کے ذریعے","حضرت جبریل علیہ السلام کے ذریعے","حضرت اسرافیل علیہ السلام کے ذریعے","حضرت میکائیل علیہ السلام کے ذریعے"],"a":1,"n":""},{"q":"سورۃ الشعراء کے آخر میں شاعروں کی عمومی کمزوریوں کو بیان کرتے ہوئے صفات بیان کی گئی ہیں:","o":["اچھے شاعروں کی","اہل ایمان کی","برے شاعروں کی","رحمان کے بندوں کی صفات"],"a":0,"n":""},{"q":"سورۃ الشعراء کے مطابق ہمیں اپنے رشتہ داروں کو باز رکھنے کی کوشش کرنی چاہیے:","o":["اللہ تعالیٰ کی نافرمانی اور شرک سے","برے کاموں سے","وعدہ خلافی سے","چوری سے"],"a":0,"n":""},{"q":"سورۃ الشعراء کے مطابق جھوٹے اور گناہ گار لوگوں کا ساتھی ہے:","o":["نفس","شیطان","برا دوست","جن"],"a":1,"n":""},{"q":"اللہ تعالیٰ نے قرآن مجید کو نازل فرمایا ہے:","o":["عبرانی میں","فارسی میں","عربی میں","ترکی میں"],"a":2,"n":""},{"q":"آیات کے لحاظ سے طویل ترین مکی سورت ہے:","o":["سورۃ الشعراء","سورۃ العنکبوت","سورۃ الروم","سورۃ لقمان"],"a":0,"n":""},{"q":"سورۃ الشعراء کے آخر میں صفات بیان کی گئی e PDF; please check them against the book."}]},{"sid":"math","t":"Chapter 7: Coordinate Geometry","q":[{"q":"The equation of a straight line in the slope-intercept form is written as:","o":["y = m(x + c)","y − y₁ = m(x − x₁)","y = c + mx","ax + by + c = 0"],"a":2,"n":""},{"q":"The gradient of two parallel lines is:","o":["Equal","Zero","Negative reciprocals of each other","Always undefined"],"a":0,"n":""},{"q":"If the product of the gradients of two lines is (−1), then the lines are:","o":["parallel","perpendicular","collinear","coincident"],"a":1,"n":""},{"q":"Distance between two points P(1, 2) and Q(4, 6) is:","o":["5","6","√13","4"],"a":0,"n":""},{"q":"The midpoint of a line segment with endpoints (−2, 4) and (6, −2) is:","o":["(4, 2)","(2, 1)","(1, 1)","(0, 0)"],"a":1,"n":""},{"q":"A line passing through points (1, 2) and (4, 5) has which equation in the slope-intercept form?","o":["y = x + 1","y = 2x + 3","y = 3x − 2","y = x + 2"],"a":0,"n":""},{"q":"The equation of a straight line in the point-slope form is written as:","o":["y = m(x + c)","y − y₁ = m(x − x₁)","y = c + mx","ax + by + c = 0"],"a":1,"n":""},{"q":"2x + 3y − 6 = 0 in the slope-intercept form is:","o":["y = (−2/3)x + 2","y = (2/3)x − 2","y = (2/3)x + 1","y = (−2/3)x − 2"],"a":0,"n":""},{"q":"The equation of a line in symmetric form is:","o":["x/a + y/b = 1","(x − x₁)/1 + (y − y₁)/m = (z − z₁)/1","ax + by + c = 0","y − y₁ = m(x − x₁)"],"a":2,"n":"Book key: (c). Strictly, the symmetric form is (x−x₁)/cosα = (y−y₁)/sinα, which is not listed here; the book's key was followed."},{"q":"The equation of a line in normal form is:","o":["y = mx + c","x/a = y/b = 1","(x − x₁)/cosα = (y − y₁)/sinα","y − y₁ = m(x − x₁)"],"a":3,"n":"Book key: (d). Strictly, the normal form is x cosα + y sinα = p, which is not listed (option (c) is the symmetric form); the book's key was followed."},{"q":"The first component of each ordered pair (x, y) is called:","o":["ordinate","Coordinate","origin","Abscissa"],"a":3,"n":""},{"q":"All points (x, y) with x > 0, y > 0 lie in quadrant:","o":["I","II","III","IV"],"a":0,"n":""},{"q":"All points (x, y) with x < 0, y < 0 lie in quadrant:","o":["I","II","III","IV"],"a":2,"n":""},{"q":"All points (x, y) with x > 0, y < 0 lie in quadrant:","o":["I","II","III","IV"],"a":3,"n":""},{"q":"All points (x, y) with x < 0, y > 0 lie in quadrant:","o":["I","II","III","IV"],"a":1,"n":""},{"q":"Which of the following is not on the x-axis:","o":["(0, 0)","(a, 0)","(b, 0)","(0, c)"],"a":3,"n":""},{"q":"Which of the following is not on the y-axis:","o":["(0, 0)","(0, e)","(0, f)","(g, 0)"],"a":3,"n":""},{"q":"The line of which equation bisects the 1st and 3rd quadrant?","o":["x − y = 0","x + y = 0","y = 2x","y = 5x"],"a":0,"n":""},{"q":"The line of which equation bisects the 2nd and 4th quadrant?","o":["x − y = 0","x + y = 0","y = −4x","y = −6x"],"a":1,"n":""},{"q":"The slope of the line is:","o":["m = (x₂ − x₁)/(y₂ − y₁)","m = (y₂ − y₁)/(x₂ − x₁)","m = (x₁ − x₂)/(y₁ − y₂)","m = (y₁ + y₂)/(x₁ − x₂)"],"a":1,"n":""},{"q":"If m₁ and m₂ are slopes of two parallel lines then:","o":["m₁ × m₂ = 0","m₁ + m₂ = 0","m₁ − m₂ = 0","m₁ × m₂ = −1"],"a":2,"n":""},{"q":"If m₁ and m₂ are slopes of two perpendicular lines then:","o":["m₁ × m₂ = 0","m₁ + m₂ = 0","m₁ − m₂ = 0","m₁ × m₂ = −1"],"a":3,"n":""},{"q":"The slope of the line x/3 + y/2 = 1 is:","o":["2/3","−2/3","−3/2","3/2"],"a":1,"n":"Verified by calculation: x/3 + y/2 = 1 → y = −(2/3)x + 2, so slope = −2/3 = (b). The book's printed key says (c), which is a misprint; the correct answer (b) is used."},{"q":"The line of which equation has slope 2 and passes through the origin?","o":["y = x + 2","y = 2x + 2","y = 2x − 2","y = 2x"],"a":3,"n":""},{"q":"If a line of slope −3 passes through the origin and P(3, k), then the value of k is:","o":["3","−3","9","−9"],"a":3,"n":""},{"q":"For what value of k, a line passing through the points (−3, −7) and (4, k) has gradient 3/7?","o":["4","−4","−3","−7"],"a":1,"n":""},{"q":"If x-coordi ns?","o":["She is indifferent and doesn't care about the inheritance.","She criticizes the adults for their materialism.","She shows confusion, hinting at her innocence compared to the adults' greed.","She eagerly participates in claiming possessions."],"a":2,"n":""},{"q":"How does Stanley Houghton use satire in The Dear Departed?","o":["to exaggerate the family's love for each other","to humorously criticize the characters' hypocrisy and greed","to create tension and suspense among the characters","to present a tragic view of death and mourning"],"a":1,"n":""},{"q":"The clock on the mantelpiece can be interpreted as a symbol of:","o":["The passing of time and routine in the family's life.","The wealth and prosperity of Mr. Merryweather.","The bond between the Slater sisters.","The memories that the family cherishes."],"a":0,"n":""}]},{"sid":"eng","t":"Unit 1 · The Saviour of Mankind","q":[{"q":"Ashfaq Ahmad was a ____ writer.","o":["famed","famous","famously","infamous"],"a":1,"n":"Choose the correct adjective (p. 13, C) · An adjective is needed before the noun 'writer'. 'Famous' fits."},{"q":"This is a very ____ seminar.","o":["information","Informed","informative","informing"],"a":2,"n":"Choose the correct adjective (p. 13, C) · 'Informative' is the adjective form of 'information'."},{"q":"My mother becomes ____ if I get home late.","o":["anxiety","anxious","anxieties","anxiously"],"a":1,"n":"Choose the correct adjective (p. 13, C) · After 'becomes' we need an adjective: 'anxious'."},{"q":"It is ____ to get the correct information from the university office.","o":["advisable","advisible","advising","advised"],"a":0,"n":"Choose the correct adjective (p. 13, C) · 'Advisable' is the correct spelling and form."},{"q":"Who is ____ for this chaos?","o":["responding","responsible","responsive","responded"],"a":1,"n":"Choose the correct adjective (p. 13, C) · 'Responsible for' is the correct collocation."}],"m":1},{"sid":"eng","t":"Unit 2 · Patriotism","q":[{"q":"The word 'patriot' originates from ____.","o":["the Greek word 'patriotikos'","the Latin word 'patriota'","the French word 'patriote'","the Spanish word 'patriota'"],"a":1,"n":"Choose the correct option (p. 21) · Para 1: 'patriota' from Latin, meaning countryman."},{"q":"What is considered a commendable quality according to the text?","o":["bravery","intelligence","patriotism","honesty"],"a":2,"n":"Choose the correct option (p. 21) · Para 1: patriotism is considered a commendable quality."},{"q":"Who led the Muslims of the subcontinent in their struggle for a separate homeland?","o":["Allama Iqbal","Liaqat Ali Khan","Quaid-e-Azam Muhammad Ali Jinnah","Sir Syed Ahmad Khan"],"a":2,"n":"Choose the correct option (p. 21) · Para 3."},{"q":"What are the supreme values for a patriot according to the text?","o":["wealth and power","sovereignty, integrity and honour","education and knowledge","freedom and independence"],"a":1,"n":"Choose the correct option (p. 21) · Para 2."},{"q":"In which wars did many brave soldiers lay down their lives for Pakistan?","o":["the wars of 1965, 1971, and the Kargil War 1999","the World War I and the World War II","the War of 1857 and the Afghan Wars","the Gulf War and the Iraq War"],"a":0,"n":"Choose the correct option (p. 21) · Para 4."},{"q":"Fact or opinion: 'Patriotism is a commendable quality.'","o":["fact","opinion"],"a":1,"n":"Fact or opinion (p. 22) · It is a value judgement, so it is an opinion."},{"q":"Fact or opinion: 'Many soldiers were awarded Nishan-e-Haider for their bravery.'","o":["fact","opinion"],"a":0,"n":"Fact or opinion (p. 22) · Para 4 states it. It can be checked."},{"q":"Generalized statement or evidence-based information: 'Many soldiers showed great bravery during the wars of 1965 and 1971.'","o":["generalized statement","evidence-based information"],"a":0,"n":"Generalized statement or evidence-based information (p. 22) · It says 'many soldiers' and names no one."},{"q":"Generalized statement or evidence-based information: 'Major Tufail Muhammad was awarded Nishan-e-Haider for his bravery in the 1965 War.'","o":["generalized statement","evidence-based information"],"a":1,"n":"Generalized statement or evidence-based information (p. 22) · It names a person, an award and a war."},{"q":"(Paragraph 2) What is the main idea of the paragraph?","o":["Patriotism is unimportant.","Patriotism requires sacrifice.","Patriotism is only about honour.","Patriotism is about personal interests."],"a":1,"n":"Reread paragraph 2 (p. 22) · Para 2: patriots 'render great sacrifice' to protect the country's supreme values."}],"m":1},{"sid":"eng","t":"Unit 3 · Daffodils (Poem)","q":[{"q":"What is the primary theme of the poem 'Daffodils'?","o":["the power of love","the beauty of nature","the importance of friendship","the struggle of life"],"a":1,"n":"Choose the correct option for each question (p. 35) · Theme box (p. 33): the beauty of nature comes first."},{"q":"To which natural element does the poet compare himself in the beginning of the poem?","o":["a tree","a river","a cloud","a mountain"],"a":2,"n":"Choose the correct option for each question (p. 35) · 'I wandered lonely as a cloud'."},{"q":"Where does the poet see the daffodils?","o":["beside a river","in a garden","beside a lake","on a mountain"],"a":2,"n":"Choose the correct option for each question (p. 35) · 'Beside the lake, beneath the trees'."},{"q":"How does the poet describe the movement of the daffodils?","o":["swaying in the wind","standing still","fluttering and dancing","falling to the ground"],"a":2,"n":"Choose the correct option for each question (p. 35) · 'Fluttering and dancing in the breeze'."},{"q":"To what does the poet compare the daffodils in terms of their continuous stretch?","o":["a flowing river","a starry night","a long road","an endless forest"],"a":1,"n":"Choose the correct option for each question (p. 35) · 'Continuous as the stars that shine / And twinkle on the milky way'."},{"q":"How many daffodils does the poet estimate he saw at a glance?","o":["hundreds","thousands","tens of thousands","hundreds of thousands"],"a":2,"n":"Choose the correct option for each question (p. 35) · Judgement-based. 'Ten thousand saw I at a glance'. 'Tens of thousands' is the closest option."},{"q":"Which word best describes the poet's initial feeling before he sees the daffodils?","o":["happy","lonely","excited","angry"],"a":1,"n":"Choose the correct option for each question (p. 35) · 'I wandered lonely as a cloud'."},{"q":"What effect do the daffodils have on the poet's mood when he later recalls them?","o":["They make him sad.","They make him anxious.","They bring him joy.","They make him tired."],"a":2,"n":"Choose the correct option for each question (p. 35) · 'And then my heart with pleasure fills'."},{"q":"What phrase does the poet use to describe his reflective moments about the daffodils?","o":["in a cheerful mood","in a vacant or in pensive mood","in a thoughtful moment","in a joyous state"],"a":1,"n":"Choose the correct option for each question (p. 35) · 'In vacant or in pensive mood'."},{"q":"Which line from the poem best conveys the lasting impact of the daffodils on the poet?","o":["I wandered lonely as a cloud","They stretched in never-ending line","And then my heart with pleasure fills","The waves beside them danced"],"a":2,"n":"Choose the correct option for each question (p. 35) · The last stanza shows the lasting effect on his heart."},{"q":"Simile: The baby's skin was as soft as ____.","o":["a rock","sandpaper","silk","wood"],"a":2,"n":"Choose appropriate words for effective comparison (p. 40) · Softness is compared with silk."},{"q":"Personification: The wind ____ through the trees, whispering secrets.","o":["an","danced","stopped","ate"],"a":1,"n":"Choose appropriate words for effective comparison (p. 40) · Judgement-based. 'Danced' gives the wind a human action. It fits the poem's 'fluttering and dancing'."},{"q":"Hyperbole: I was so hungry, I could eat a ____.","o":["sandwich","fruit","horse","vegetable"],"a":2,"n":"Choose appropriate words for effective comparison (p. 40) · 'Eat a horse' is the exaggeration."},{"q":"Imagery: The sky was painted with hues of pink and ____ as the sun set.","o":["green","blue","orange","purple"],"a":2,"n":"Choose appropriate words for effective comparison (p. 40) · Judgement-based. Pink and orange are the usual sunset colours."},{"q":"Metaphor: Time is a great ____.","o":["river","stone","tree","healer"],"a":3,"n":"Choose appropriate words for effective comparison (p. 40) · Judgement-based. 'Time is a great healer' is the familiar metaphor."},{"q":"Assonance: The lazy ____ sat on a mat.","o":["worm","bus","cat","mouse"],"a":2,"n":"Choose appropriate words for effective comparison (p. 40) · Judgement-based. 'Cat' repeats the short 'a' sound of 'sat' and 'mat'. The other options do not."},{"q":"Alliteration: The cold, crisp, ____ snow crunched underfoot.","o":["colourful","clean","quiet","melting"],"a":1,"n":"Choose appropriate words for effective comparison (p. 40) · Judgement-based. 'Clean' fits snow best and repeats the 'c' sound. 'Colourful' also starts with c but does not suit snow."}],"m":1},{"sid":"eng","t":"Unit 4 · Hazrat Asma","q":[{"q":"Which action taken by Hazrat Asma demonstrated her handling of trust?","o":["preparing food for the journey","keeping the secret of her father's whereabouts","tying the food on the camel's back","all of the above"],"a":1,"n":"Choose the correct option for each question (pp. 53-54) · Judgement-based. Para 4: she did not reveal the secret even after being slapped. The teacher notes link 'handling of trust' to safeguarding what was entrusted to her."},{"q":"Hazrat Asma's response to Abu Jehl's demand showed her:","o":["fear","self-discipline","anger","indifference"],"a":1,"n":"Choose the correct option for each question (pp. 53-54) · Para 4: she stayed calm and steadfast. The teacher notes link self-discipline to her steadfastness."},{"q":"How did Hazrat Asma respect her function resStats(){try{const h=hist().filter(r=>!HIDE_NAMES.includes(r.s));if(!h.length)return null;const by={};h.forEach(r=>{const k=r.s=="Answer Sheet"?"E-Sheet":r.s,e=by[k]=by[k]||{n:0,p:0};e.n++;e.p+=r.sc/r.n*100});return{n:h.length,avg:Math.round(h.reduce((a,r)=>a+r.sc/r.n*100,0)/h.length),best:Math.max(...h.map(r=>Math.round(r.sc/r.n*100))),by:Object.entries(by).map(([k,e])=>({k,n:e.n,p:Math.round(e.p/e.n)})).sort((a,b)=>a.p-b.p)}}catch(e){return null}}
const rcol=p=>p>=80?"#16a34a":p>=50?"#d97706":"#dc2626";
const TICK=80;
function resAll(){const h=hist().filter(r=>!HIDE_NAMES.includes(r.s));if(!h.length)return'<p class="nt">No results yet. Finish a chapter test and its latest result will appear here.</p>';const S=resStats(),pc=r=>Math.round(r.sc/r.n*100),inc=r=>r.w!=null?r.w:r.n-r.sc,sub={};
h.forEach(r=>{const k=r.s=="Answer Sheet"?"E-Sheet practice":r.s;(sub[k]=sub[k]||[]).push(r)});
const ticks=h.filter(r=>pc(r)>=TICK).length;
let o=`<div class="os-card"><div class="rsum"><div><b>${h.length}</b><small>attempted</small></div><div><b style="color:${rcol(S.avg)}">${S.avg}%</b><small>average</small></div><div><b>${S.best}%</b><small>best</small></div><div><b style="color:#16a34a">${ticks}</b><small>✓ ${TICK}%+</small></div></div></div>`;
Object.keys(sub).sort((a,b)=>a.localeCompare(b)).forEach(k=>{const L=sub[k].slice().sort((a,b)=>String(a.c).localeCompare(String(b.c),undefined,{numeric:true})),av=Math.round(L.reduce((t,r)=>t+pc(r),0)/L.length);
o+=`<div class="os-card"><h3>${esc(k)} <small style="font-weight:400;color:var(--mut)">${L.length} attempted · avg ${av}%</small></h3>`+L.map(r=>{const p=pc(r),w=inc(r),sk=r.sk>0?" · "+r.sk+" skipped":"";return`<div class="row r"><span>${esc(r.c)}<br><small>${fd(r.t)} · ${r.sc}/${r.n} correct · ✗ ${w} incorrect${sk}</small></span><b style="color:${rcol(p)};white-space:nowrap">${p}%${p>=TICK?' <span style="color:#16a34a">✓</span>':""}</b></div>`}).join("")+"</div>"});
return o+'<div class="nt">Only your latest result for each chapter is shown. Retaking a chapter replaces its old result. Results are saved permanently on this device and backed up online by your name; app updates never erase them.</div>'}
function progStrip(){const S=resStats();return S?`<button class="ntb" style="background:#1d4ed8" onclick="nav('mres')">📊 My progress · ${S.n} test${S.n>1?"s":""} · average ${S.avg}% ›</button>`:""}
function qres(){const d=document.createElement("div");d.className="ov";d.innerHTML='<div class="mb" style="max-height:85vh;overflow:auto;text-align:left"><b style="font-size:1.2em">📊 My progress</b>'+resAll()+'<div style="text-align:center"><button class="nb nx" onclick="this.closest(\'.ov\').remove()">Back to test</button><button class="nb pv" onclick="qopen()">Open full results</button></div></div>';document.body.appendChild(d)}
function qopen(){document.querySelectorAll(".ov").forEach(e=>e.remove());if(T&&!T.done&&!confirm("Leave this test? Your answers so far will be lost."))return;nav("mres")}
function mres(){document.body.className="";$("#app").innerHTML=nh("📊 My results","Latest result of every chapter · saved permanently")+'<div id="rrm">'+resAll()+"</div>";scrollTo(0,0);sync()}
const HD=[{"a":"عَنْ مُعَاوِيَةَ رضي الله عنه قَالَ: سَمِعْتُ النَّبِيَّ ﷺ يَقُوْلُ: مَن يُرِدِ اللهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّيْنِ، وَإِنَّمَا أَنَا قَاسِمٌ وَاللهُ يُعْطِي.","u":"حضرت معاویہ رضی اللہ عنہ سے روایت ہے کہ میں نے حضور نبی اکرم ﷺ کو فرماتے ہوئے سنا: اللہ تعالیٰ جس کے ساتھ بھلائی کا ارادہ فرماتا ہے اسے دین کی سمجھ بوجھ عطا فرما دیتا ہے، اور میں تو بس تقسیم کرنے والا ہوں جبکہ دیتا اللہ تعالیٰ ہے۔","r":"متفق علیہ · صحیح بخاری، کتاب العلم، رقم 71","s":"باب 8 · حدیث 461","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَنَسٍ بْنِ مَالِکٍ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: مَنْ خَرَجَ فِي طَلَبِ الْعِلْمِ کَانَ فِي سَبِيْلِ اللهِ حَتَّى يَرْجِعَ.","u":"حضرت انس رضی اللہ عنہ فرماتے ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: جو شخص حصولِ علم کے لئے نکلا وہ اس وقت تک اللہ تعالیٰ کی راہ میں ہے جب تک کہ واپس نہیں لوٹ آتا۔","r":"جامع ترمذی، کتاب العلم، رقم 2647","s":"باب 8 · حدیث 462","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: سَمِعْتُ رَسُوْلَ اللهِ ﷺ يَقُوْلُ: أَ لَا! إِنَّ الدُّنْيَا مَلْعُوْنَةٌ مَلْعُوْنٌ مَا فِيْهَا إِلَّا ذِکْرُ اللهِ وَمَا وَالَاهُ وَعَالِمٌ أَوْ مُتَعَلِّمٌ.","u":"حضرت ابوہریرہ رضی اللہ عنہ روایت کرتے ہیں کہ میں نے حضور نبی اکرم ﷺ کو یہ فرماتے ہوئے سنا: اللہ تعالیٰ کا ذکر اور اس کا دم بھرنے والے اور عالم اور طالب علموں کو چھوڑ کر بقایا دنیا اور جو کچھ اس (دنیا) میں ہے سب ملعون ہیں۔","r":"جامع ترمذی رقم 2322، ابن ماجہ رقم 4112","s":"باب 8 · حدیث 463","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: مَنْ تَعَلَّمَ عِلْمًا مِمَّ يُبْتَغَي بِهِ وَجْهُ اللهِ، لا يَتَعَلَّمُهُ إِلاَّ لِيُصِيْبَ بِهِ عَرَضًا مِنَ الدُّنْيَا، لَمْ يَجِدْ عَرْفَ الْجَنَّةِ يَوْمَ الْقِيَامَةِ يَعْنِي رِيْحَهَا.","u":"حضرت ابوہریرہ رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: جس نے علم حاصل کیا جس سے اللہ تعالیٰ کی رضامندی حاصل کی جاتی ہے لیکن (اگر) وہ یہ علم حصولِ دنیا کے لئے سیکھتا ہے تو قیامت کے روز وہ جنت کی خوشبو بھی نہیں پائے گا۔","r":"سنن ابو داؤد رقم 3664، ابن ماجہ رقم 252","s":"باب 8 · حدیث 464","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي أُمَامَةَ الْبَاهِلِيِّ رضي الله عنه، قَالَ: ذُکِرَ لِرَسُوْلِ اللهِ ﷺ رَجُلاَنِ: أَحَدُهُمَا عَابِدٌ وَالْآخَرُ عَالِمٌ، فَقَالَ رَسُوْلُ اللهِ ﷺ: فَضْلُ الْعَالِمِ عَلىٰ الْعَابِدِ، کَفَضْلِي عَلىٰ أَدْنَاکُمْ، ثُمَّ قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّ اللهَ، وَمَلاءِکَتَهُ، وَأَهْلَ السَّمَوَاتِ، وَالْأَرْضِيْنَ، حَتَّى النَّمْلَةَ فِي جُحْرِهَا وَحَتَّى الْحُوْتَ، لَيُصَلُّوْنَ عَلىٰ مُعَلِّمِ النَّاسِ الْخَيْرَ.","u":"حضرت ابو اُمامہ باہلی رضی اللہ عنہ سے روایت ہے کہ حضور نبی اکرم ﷺ کے سامنے دو آدمیوں کا ذکر کیا گیا: جن میں سے ایک عابد تھا اور دوسرا عالم، حضور نبی اکرم ﷺ نے فرمایا: عابد پر عالم کی فضیلت اسی طرح ہے جس طرح میری فضیلت تم میں سے ایک ادنی (صحابی) پر ہے۔ پھر آپ ﷺ نے فرمایا: بے شک اللہ تعالیٰ، اس کے فرشتے، (تمام) زمین و آسمان والے یہاں تک کہ چیونٹی اپنے بل میں اور مچھلیاں (بھی سمندروں، دریاؤں اور تالابوں میں) اس شخص کے لئے رحمت (کی دعا) مانگتے ہیں جو لوگوں کو بھلائی کی تعلیم دیتا ہے۔","r":"جامع ترمذی رقم 2685، سنن دارمی رقم 289","s":"باب 8 · حدیث 465","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي الدَّرْدَاءِ رضي الله عنه قَالَ: سَمِعْتُ رَسُوْلَ اللهِ ﷺ، يَقُولُ: مَنْ سَلَکَ طَرِيْقًا يَبْتَغِي فِيْهِ عِلْمًا سَلَکَ اللهُ لَهُ طَرِيْقًا إِلَي الْجَنَّةِ، وَإِنَّ الْمَلَائِکَةَ لَتَضَعُ أَجْنِحَتَهَا، رِضَاءً لِطَالِبِ الْعِلْمِ.","u":"حضرت ابودرداء رضی اللہ عنہ فرماتے ہیں کہ میں نے حضور نبی اکرم ﷺ کو فرماتے ہوئے سنا: جو آدمی طلبِ علم میں کسی راستہ پر چلتا ہے تو اللہ تعالیٰ اسے جنت کے راستے پر چلا دیتا ہے۔ اور بیشک فرشتے طالبِ علم کی رضا کے حصول کے لئے اس کے پاؤں تلے اپنے پر بچھاتے ہیں۔","r":"جامع ترمذی رقم 2682 (حدیث کا ابتدائی حصہ)","s":"باب 8 · حدیث 466","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنِ ابْنِ عَبَّاسٍ رضي الله عنهما، قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: فَقِيْهٌ أَشَدُّ عَلىٰ الشَّيْطَانِ مِنْ أَلْفِ عَابِدٍ. وفي رواية: وَلِکُلِّ شَيءٍ عِمَادٌ وَعِمَادُ هَذَا الدِّيْنِ الْفِقْهُ.","u":"حضرت عبد اللہ بن عباس رضی اللہ عنہما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: ایک فقیہ، ایک ہزار عابد سے زیادہ شیطان پر سخت اور بھاری ہے۔ اور ایک روایت کے الفاظ ہیں کہ ہر ایک شے کا ستون ہوتا ہے اور اس دین کا ستون (علم) فقہ ہے۔","r":"جامع ترمذی رقم 2681، ابن ماجہ رقم 222","s":"باب 8 · حدیث 467","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَنَسِ بنِ مَالِکٍ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّ مَثَلَ الْعُلَمَاءِ فِي الْأَرْضِ کَمَثَلِ النُّجُومِ فِي السَّمَاءِ يُهتَدَي بِهَا فِي ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ فَإِذَا انْطَمَسَتِ النُّجُوْمُ أَوْشَکَ أَنْ تَضِلَّ الْهُدَاةُ.","u":"حضرت انس بن مالک رضی اللہ عنہ سے روایت ہے کہ حضور نبی اکرم ﷺ نے فرمایا: علمائے کرام زمین میں ان ستاروں کی طرح ہیں جن کے ذریعے بحر و بر کے اندھیروں میں رہنمائی حاصل کی جاتی ہے۔ اور اگر ستارے غروب ہوجائیں تو قریب ہے کہ (مسافروں کو راستہ دکھانے والے) رہنما بھٹک جائیں۔ (یعنی علماء کرام نہیں ہوں گے تو عوام گمراہ ہو جائیں گے)۔","r":"مسند احمد بن حنبل رقم 12621","s":"باب 8 · حدیث 468","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ عَبْدِ اللهِ ابْنِ عُمَرَ رضي الله عنهما قَالَ: سَمِعْتُ رَسُوْلَ اللهِ ﷺ يَقُوْلُ: لَا حَسَدَ إِلاَّ عَلَى اثْنَتَيْنِ: رَجُلٌ آتَاهُ اللهُ الْکِتَابَ وَقَامَ بِهِ آنَاءَ اللَّيْلِ، وَرَجُلٌ أَعْطَاهُ اللهُ مَالًا فَهُوَ يَتَصَدَّقُ بِهِ آنَاءَ اللَّيْلِ وَالنَّهَارِ.","u":"حضرت عبداللہ بن عمر رضی اللہ عنھما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: حسد (یعنی رشک) صرف دو آدمیوں سے کرنا چاہئے: ایک وہ شخص جسے اللہ تعالیٰ نے قرآنِ پاک عطا کیا ہوا اور وہ رات کو نماز میں اس کی تلاوت کرے، دوسرا وہ شخص ہے جسے اللہ تعالیٰ نے مال و دولت سے نوازا ہو وہ اسے رات کی گھڑیوں اور دن کے مختلف حصوں میں (راہِ الٰہی میں) خرچ کرتا رہے۔","r":"متفق علیہ · صحیح بخاری رقم 4737","s":"باب 8 · حدیث 46","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنِ ابْنِ عَبَّاسٍ رضي الله عنهما قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: أَشْرَافُ أُمَّتِي حَمَلَةُ الْقُرْآنِ وَأَصْحَابُ اللَّيْلِ.","u":"حضرت عبد اللہ بن عباس رضی اللہ عنھما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: قرآن کے عالم و عامل اور شب زندہ دار (لوگ) میری امت کے اشراف (سردار) ہیں۔","r":"شعب الایمان للبیہقی رقم 2703","s":"باب 8 · حدیث 52","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ عَبْدِ اللهِ بْنِ سَلَامٍ رضي الله عنه قَالَ: وَکَانَ أَوَّلُ مَا سَمِعْتُ مِنْ کَلَامِهِ ﷺ أَنْ قَالَ: أَيُّهَا النَّاسُ أَفْشُوا السَّلَامَ وَأَطْعِمُوْا الطَّعَامَ وَصِلُوا الْأَرْحَامَ وَصَلُّوْا بِاللَّيْلِ وَالنَّاسُ نِيَامٌ تَدْخُلُوْنَ الْجَنَّةَ بِسَلَامٍ.","u":"حضرت عبد اللہ بن سلام رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ کا سب سے پہلا کلام جو میں نے سنا یہ تھا، آپ ﷺ نے فرمایا: اے لوگو! سلام پھیلاؤ (یعنی کثرت سے ایک دوسرے کو سلام کیا کرو) کھانا کھلایا کرو، خونی رشتوں کے ساتھ بھلائی کیا کرو اور راتوں کو (اٹھ کر) نماز پڑھا کرو، جب کہ لوگ سوئے ہوئے ہوں تم سلامتی کے ساتھ جنت میں داخل ہو جاؤ گے۔","r":"جامع ترمذی رقم 2485، ابن ماجہ رقم 1334","s":"باب 8 · حدیث 55","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه أَنَّ رَسُوْلَ اللهِ ﷺ قَالَ: إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: إِلَّا مِنْ صَدَقَةٍ جَارِيَةٍ. أَوْ عِلْمٍ يُنْتَفَعُ بِهِ. أَوْ وَلَدٍ صَالِحٍ يَدْعُوْ لَهُ.","u":"حضرت ابوہریرہ رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: جب انسان مر جاتا ہے تو اس کے اعمال کا سلسلہ ختم ہو جاتا ہے سوائے تین چیزوں کے (ان کا اجر اسے برابر ملتا رہتا ہے: ) ایک وہ صدقہ جس کا نفع جاری رہے، دوسرا وہ علم جس سے فائدہ اٹھایا جائے تیسری وہ نیک اولاد جو اس کے لئے دعا کرے۔","r":"صحیح مسلم رقم 1631، ابو داؤد رقم 2880","s":"باب 8 · حدیث 87","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ عَائِشَةَ رضي الله عنها قَالَتْ: قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّ مِنْ أَکْمَلِ الْمُؤْمِنِيْنَ إِيْمَانًا أَحْسَنُهُمْ خُلُقًا وَأَلْطَفُهُمْ بِأَهْلِهِ.","u":"حضرت عائشہ رضی اللہ عنہا روایت کرتی ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: مومنوں میں سے کامل ترین مومن وہ ہے جو بہترین اخلاق کا مالک ہے۔ اور اپنے اہل و عیال کے ساتھ انتہائی نرم ہے۔","r":"جامع ترمذی رقم 2612","s":"باب 14 · حدیث 875","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي الدَّرْدَاءِ رضي الله عنه عَنِ النَّبِيِّ ﷺ قَالَ: مَا مِنْ شَيءٍ أَثْقَلُ فِي الْمِيْزَانِ مِنْ حُسْنِ الْخُلُقِ.","u":"حضرت ابودرداء رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: حسنِ اخلاق سے بڑھ کر میزان میں بھاری چیز کوئی نہیں ہوگی۔","r":"جامع ترمذی رقم 2002، ابو داؤد رقم 4799","s":"باب 14 · حدیث 879","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ جَابِرِ رضي الله عنه أَنَّ رَسُوْلَ اللهِ ﷺ قَالَ: إِنَّ مِنْ أَحَبِّکُمْ إِلَيَّ وَأَقْرَبِکُمْ مِنِّي مَجْلِسًا يَوْمَ الْقِيَامَةِ أَحَاسِنَکُمْ أَخْلَاقًا.","u":"حضرت جابر رضی اللہ عنہ روایت کرتے ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: تم میں سب سے زیادہ محبوب اور قیامت کے دن میرے نزدیک ترین بیٹھنے والے وہ لوگ ہیں جو تم میں سے اخلاق میں اچھے ہیں۔","r":"جامع ترمذی رقم 2018","s":"باب 14 · حدیث 877","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي ذَرٍّ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: تَبَسُّمُکَ فِي وَجْهِ أَخِيْکَ لَکَ صَدَقَةٌ.","u":"حضرت ابوذر رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: تمہارا اپنے مسلمان بھائی کے لئے مسکرانا بھی صدقہ ہے۔","r":"جامع ترمذی رقم 1956","s":"باب 14 · حدیث 881","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ جَرِيْرٍ رضي الله عنه عَنِ النَّبِيِّ ﷺ قَالَ: مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ.","u":"حضرت جریر رضی اللہ عنہ سے روایت ہے کہ حضور نبی اکرم ﷺ نے فرمایا: جو نرمی سے محروم ہوا وہ خیر سے محروم ہو گیا۔","r":"صحیح مسلم رقم 2592، ابو داؤد رقم 4809","s":"باب 14 · حدیث 884","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ عَبْدِ اللهِ بْنِ مَسْعُودٍ رضي الله عنه قَالَ: سَأَلْتُ رَسُوْلَ اللهِ ﷺ أَيُّ الْعَمَلِ أَحَبُّ إِلَی اللهِ؟ قَالَ: الصَّلَاةُ عَلَى وَقْتِهَا قَالَ: ثُمَّ أَيٌّ؟ قَالَ: بِرُّ الْوَالِدَيْنِ قَالَ: ثُمَّ أَيٌّ؟ قَالَ: اَلْجِهَادُ فِي سَبِيْلِ اللهِ.","u":"حضرت عبداللہ بن مسعود رضی اللہ عنہ فرماتے ہیں کہ میں نے حضور نبی اکرم ﷺ سے دریافت کیا: اللہ تعالیٰ کو کون سا عمل سب سے زیادہ پسند ہے؟ آپ ﷺ نے فرمایا: وقت پر نماز پڑھنا۔ میں نے عرض کیا: پھر کون سا؟ آپ ﷺ نے فرمایا: والدین سے حسن سلوک کرنا۔ میں نے عرض کیا: پھر کون سا؟ آپ ﷺ نے فرمایا: اللہ تعالیٰ کی راہ میں جہاد کرنا۔","r":"متفق علیہ · صحیح بخاری رقم 504، صحیح مسلم رقم 85","s":"باب 14 · حدیث 890","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي أُمَامَةَ رضي الله عنه أَنَّ رَجُلًا قَالَ: يَا رَسُوْلَ اللهِ! مَا حَقُّ الْوَالِدَيْنِ عَلَى وَلَدِهِمَا؟ قَالَ: هُمَا جَنَّتُکَ وَنَارُکَ.","u":"حضرت ابو امامہ رضی اللہ عنہ روایت کرتے ہیں کہ ایک آدمی آیا اور اس نے عرض کیا: یا رسول اللہ! والدین کا اپنی اولاد پر کتنا حق ہے؟ آپ ﷺ نے فرمایا: وہ دونوں تیری جنت (بھی) ہیں اور دوزخ (بھی)۔ (یعنی ان کی خدمت کرکے جنت حاصل کرلو یا نافرمانی کرکے دوزخ کے مستحق ہو جاؤ)۔","r":"سنن ابن ماجہ رقم 3662","s":"باب 14 · حدیث 895","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ جَاهِمَةَ رضي الله عنه قَالَ: أَتَيْتُ النَّبِيَّ ﷺ أَسْتَشِيْرُهُ فِي الْجِهَادِ فَقَالَ النَّبِيُّ ﷺ: أَلَکَ وَالِدَانِ؟ قُلْتُ: نَعَمْ قَالَ: إِلْزَمْهُمَا فَإِنَّ الْجَنَّةَ تَحْتَ أَرْجُلِهِمَا.","u":"حضرت جاہمہ رضی اللہ عنہ روایت کرتے ہیں کہ میں جہاد کا مشورہ لینے کے لئے حضور نبی اکرم ﷺ کی خدمت میں حاضر ہوا۔ حضور نبی اکرم ﷺ نے فرمایا: کیا تمہارے ماں باپ زندہ ہیں؟ میں نے عرض کیا: جی ہاں (زندہ ہیں)۔ آپ ﷺ نے فرمایا: انہی کے ساتھ رہو کہ جنت ان کے پاؤں تلے ہے۔","r":"سنن نسائی رقم 3104","s":"باب 14 · حدیث 898","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ عَبْدِ اللهِ بْنِ عَمْرٍو رضي الله عنهما عَنِ النَّبِيِّ ﷺ قَالَ: رِضَي الرَّبِّ فِي رِضَي الْوَالِدِ، وَسَخَطُ الرَّبِّ فِي سَخَطِ الْوَالِدِ.","u":"حضرت عبداللہ بن عمرو رضی اللہ عنہما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: رب کی رضا والد کی رضا میں ہے اور رب کی ناراضگی والد کی ناراضگی میں ہے۔","r":"جامع ترمذی رقم 1899","s":"باب 14 · حدیث 917","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَبَّلَ رَسُوْلُ اللهِ ﷺ الْحَسَنَ بْنَ عَلِيٍّ رضي الله عنهما وَعِنْدَهُ الأَقْرَعُ بْنُ حَابِسٍ التَّمِيْمِيُّ جَالِسًا، فَقَالَ الْأَقْرَعُ: إِنَّ لِي عَشَرَةً مِنَ الْوَلَدِ مَا قَبَّلْتُ مِنْهُمْ أَحَدًا فَنَظَرَ إِلَيْهِ رَسُوْلُ اللهِ ﷺ، ثُمَّ قَالَ: مَنْ لاَ يَرْحَمُ لاَ يُرْحَمُ.","u":"حضرت ابوہریرہ رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے حضرت حسن بن علی رضی الله عنہما کو چوما تو آپ ﷺ کے پاس اس وقت اقرع بن حابس تمیمی بھی بیٹھا تھا وہ بولا: میرے دس بیٹے ہیں میں نے تو کبھی ان میں سے کسی کو نہیں چوما۔ اس پر حضور نبی اکرم ﷺ نے اس کی طرف دیکھ کر فرمایا: جو رحم نہیں کرتا اس پر رحم نہیں کیا جاتا۔","r":"متفق علیہ · صحیح بخاری رقم 5651، صحیح مسلم رقم 2315","s":"باب 14 · حدیث 906","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ عَمْرٍو بْنِ شُعَيْبٍ رضي الله عنه، عَنْ أَبِيْهِ عَنْ جَدِّهِ قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا، وَيَعْرِفْ شَرَفَ کَبِيْرِنَا.","u":"حضرت عمرو بن شعیب رضی اللہ عنہ بواسطہ اپنے والد اپنے دادا سے روایت کرتے ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: وہ شخص ہم میں سے نہیں ہے جو ہمارے چھوٹوں پر رحم نہ کرے اور ہمارے بڑوں کی قدر و منزلت نہ پہچانے۔","r":"جامع ترمذی رقم 1920، ابو داؤد رقم 4941","s":"باب 14 · حدیث 923","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي الدَّرْدَاءِ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّکُمْ تُدْعَوْنَ يَوْمَ الْقِيَامَةِ بِأَسْمَائِکُمْ وَأَسْمَاءِ آبَائِکُمْ فَأَحْسِنُوْا أَسْمَاءَ کُمْ.","u":"حضرت ابودرداء رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: تم قیامت کے روز اپنے ناموں اور اپنے باپوں کے ناموں سے پکارے جاؤ گے، لہٰذا اپنے (اور اپنے بچوں کے) نام خوبصورت رکھا کرو۔","r":"سنن ابو داؤد رقم 4948","s":"باب 14 · حدیث 918","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"}];
function hdCard(open){const d=new Date(),k=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),x=HD[k%HD.length];
return`<details class="hdc"${open?" open":""}><summary><span>📿 Today's Hadith · آج کی حدیث</span><span class="hdp ur">${esc(x.u.slice(0,56))}…</span></summary><div class="hda">${esc(x.a)}</div><div class="ur hdu">${esc(x.u)}</div><div class="hds">${esc(x.r)}</div><div class="hds">📖 المنہاج السوی من الحدیث النبوی · ڈاکٹر محمد طاہر القادری · ${esc(x.s)}</div><a class="gx-pdf" href="${x.l}" target="_blank" rel="noopener" style="margin:4px 0 0;font-size:.8em">📖 Read in the book ›</a></details>`}
