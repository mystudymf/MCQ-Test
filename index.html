"They are useful only when equilibrium lies far to the right side","They are useful only when equilibrium lies far to the left side"],"a":2,"n":""},{"q":"What will happen to the concentrations of the products if a reversible reaction at equilibrium is not disturbed?","o":["They will remain constant","They will keep on increasing","They will keep on decreasing","They will remain constant for some time and then start decreasing"],"a":0,"n":""},{"q":"In an irreversible reaction, equilibrium is:","o":["established quickly","established slowly","never established","established when reaction stops"],"a":2,"n":""},{"q":"The characteristics of reversible reactions are the following except:","o":["products never recombine to form reactants","they never complete","they proceed in both ways","they have a double arrow between reactants and products"],"a":0,"n":""},{"q":"The reactions in which the products do not recombine to form reactants are called:","o":["Irreversible reactions","Reversible reactions","Decomposition reactions","Addition reactions"],"a":0,"n":""},{"q":"The reactions in which the products can recombine to form reactants are called:","o":["Irreversible reactions","Reversible reactions","Decomposition reactions","Addition reactions"],"a":1,"n":""},{"q":"Which type of reaction speeds up gradually?","o":["Irreversible reactions","Reverse reactions","Forward reactions","Decomposition reactions"],"a":1,"n":""},{"q":"Reactions that continue in both directions are called:","o":["Irreversible","Reversible","Non-reactive","Dynamic"],"a":1,"n":""},{"q":"In a chemical reaction, the substances that combine are called:","o":["Reactants","Products","Masses","Materials"],"a":0,"n":""},{"q":"The forward reaction takes place from:","o":["Right to left","Left to right","Both a & b","None of the above"],"a":1,"n":""},{"q":"Equilibrium state can be achieved in:","o":["Closed system","Open system","Both a & b","None of these"],"a":0,"n":""},{"q":"A complete reaction is one in which:","o":["All the reactants convert into products","All the reactants do not convert into products","Half reactants convert into products","Only 10% reactants convert into products"],"a":0,"n":""},{"q":"In the beginning the rate of reverse reaction is:","o":["Moderate","Negligible","Slow","Very fast"],"a":1,"n":""},{"q":"The new substance formed in a chemical reaction is:","o":["Reactant","Product","Forward","Reverse"],"a":1,"n":""},{"q":"The colour of anhydrous copper (II) sulphate solid is:","o":["Blue","Pink","Black","White"],"a":3,"n":""},{"q":"The colour of hydrated copper (II) sulphate solid is:","o":["Blue","Pink","Black","White"],"a":0,"n":""},{"q":"The colour of anhydrous cobalt (II) chloride solid is:","o":["Blue","Pink","Black","White"],"a":0,"n":""},{"q":"The colour of hydrated cobalt (II) chloride solid is:","o":["Blue","Pink","Black","White"],"a":1,"n":""},{"q":"Which of the following does not happen when a system is at equilibrium state?","o":["Forward and reverse reactions stop","Forward and reverse rates become equal","Concentration of reactants and products stop changing","Reaction continues to occur in both the directions"],"a":0,"n":""},{"q":"Which is true about the equilibrium state?","o":["The forward reaction stops","The reverse reaction stops","Both forward and reverse reactions stop","Both forward and reverse reactions continue at the same rate"],"a":3,"n":""},{"q":"When a system is at equilibrium state:","o":["The concentration of reactants and product becomes equal","The opposing reactions (forward the reverse) stop","The rate of the reverse reaction becomes very low","The rate of the forward and reverse reactions become equal"],"a":3,"n":""},{"q":"When the rate of the forward reaction takes place at the rate of reverse reaction the composition of the reaction mixture remains constant, it is called:","o":["chemical equilibrium","static equilibrium","both (a) & (b)","none of the above"],"a":0,"n":""},{"q":"Which type of reactions do not go to completion?","o":["irreversible reactions","reversible reactions","addition reactions","decomposition reactions"],"a":1,"n":""},{"q":"For the following reaction, equilibrium mixture will contain: N₂O₄(g) ⇌ 2NO₂(g), Kc = 0.211","o":["Only N₂O₄","Only NO₂","NO₂ and N₂O₄ in reasonable amount","NO₂ in large amount"],"a":2,"n":""},{"q":"Nitrogen and hydrogen were reacted together to make ammonia: N₂ + 3H₂ ⇌ 2NH₃, Kc = 2.86 mol⁻²dm⁶. What will be present in the equilibrium mixture?","o":["NH₃ only","N₂, H₂ and NH₃","N₂ and H₂ only","H₂ only"],"a":1,"n":""},{"q":"Concentration of reactants and products at equilibrium remains unchanged if:","o":["Concentration of any reactant or product is not changed","Temperature of the reaction is not changed","Pressure or volume of the system is not changed","All of the above are observed"],"a":3,"n":""},{"q":"At what temperature, rate of ammonia formation and decomposition is the highest:","o":["300 °C","400 °C","500 °C","600 °C"],"a":1,"n":"Book key: (b) 400 °C (the usual working temperature for ammonia). Strictly, rates rise with temperature, so 600 °C is fastest; book key followed."},{"q":"Formation of ammonia from nitrogen and hydrogen is an:","o":["Exothermic Reaction","Endothermic Reaction","Both A & B","No heat change"],"a":0,"n":""},{"q":"How much heat absorbed when NH₃ decomposed into N₂ and H₂?","o":["90.4 kJ/mol","94.2 kJ/mol","92.4 kJ/mol","95.2 kJ/mol"],"a":2,"n":""},{"q":"Which compound is used a thinner in paint industry?","o":["C₂H₅OH","CH₃COOH","CH₃COOC₂H₅","H₂O"],"a":2,"n":""}]},{"sid":"chem","t":"Chapter 7 · Acids and Bases","q":[{"q":"Which acid is not used as a food or mixed with food?","o":["Tartaric acid","Ascorbic acid","Citric acid","Formic acid"],"a":3,"n":""},{"q":"While baking, which gas is responsible for raising the bread and making it soft?","o":["Oxygen","Carbon dioxide","Nitrogen","Carbon monoxide"],"a":1,"n":""},{"q":"Predict the main characteristics of the reactions of metals with acids.","o":["Metals are dissolved","Metals are converted into salts","Hydrogen gas is evolved","All the above mentioned characteristics are true"],"a":3,"n":""},{"q":"How many hydroxide ions, calcium hydroxide will release in water?","o":["1","2","Zero","3"],"a":1,"n":""},{"q":"In a neutralization reaction between KOH and H₃PO₄, how many molecules of KOH will react with one molecule of H₃PO₄?","o":["2","1","3","4"],"a":2,"n":""},{"q":"Which acid is used in the preparation of soap?","o":["Tartaric acid","Citric acid","Stearic acid","Oxalic acid"],"a":2,"n":""},{"q":"Which compound is formed when SO₂ is dissolved in water?","o":["SO₃","H₂SO₃","H₂SO₄","H₂S₂O₇"],"a":1,"n":""},{"q":"Which of the following contains oxalic acid?","o":["Tomato","Orange","Tamarind","Sour milk"],"a":0,"n":""},{"q":"Which compound in the following reaction is behaving as a conjugate base? CH₃COOH(aq) + H₂O(l) → CH₃COO⁻ + H₃O⁺(aq)","o":["CH₃COOH","H₂O","CH₃COO⁻","H₃O⁺"],"a":2,"n":""},{"q":"When a chemical reaction is carried out with a substance Z; a gas is produced which turns red litmus paper blue. What is the reaction?","o":["Reaction of an acid with a metal carbonate","Reaction of an acid with a metal hydrogen carbonate","Reaction of an alkali with acid","Reaction of an alkali with ammonium salt"],"a":3,"n":""},{"q":"A base is a substance which neutralizes an acid. Which of these substances is not a base?","o":["Aqueous ammonia","Sodium chloride","Sodium carbonate","Calcium oxide"],"a":1,"n":""},{"q":"Acetic acid is used for:","o":["Flavouring food","Making explosives","Etching designs","Cleaning metals"],"a":0,"n":""},{"q":"Acids means:","o":["Sour","Bitter","Sweet","Salty"],"a":0,"n":""},{"q":"All acids turn blue litmus:","o":["Red","Colourless","Pink","White"],"a":0,"n":"Acids turn blue litmus red."},{"q":"All bases turn red litmus:","o":["Colourless","Blue","Pink","White"],"a":1,"n":""},{"q":"Which of the following cannot be classified as Arrhenius acid?","o":["HNO₃","H₂CO₃","CO₂","H₂SO₄"],"a":2,"n":""} function doLogin(){const us=ls.g("users",[]),v=$("#us").value;let u;if(v!=="")u=us[+v];else{const n=$("#nm").value.trim();if(!n)return $("#nm").focus();u={name:n,roll:$("#rl").value.trim(),cls:"Grade 9"};let k=us.findIndex(x=>x.name==u.name&&x.roll==u.roll);if(k<0){us.push(u);k=us.length-1}ls.s("users",us);ls.s("last",k)}if(v!=="")ls.s("last",+v);U=u;ls.s("user",U);home()}
const out=()=>{U=null;ls.s("user",null);login()};
const cnt=s=>DB.tops.filter(t=>t.sid==s.id).reduce((a,t)=>a+t.q.length,0);
function home(){document.body.className="ishome";$("#app").innerHTML=`<div class="hd" style="text-align:center;font-size:1.5em;line-height:1.2">MCQ-Quiz<small style="font-size:.5em;font-weight:600;letter-spacing:1px">Grade-9</small></div><div class="card" style="margin-top:0">Welcome, <b>${esc(U.name)}</b><br><small>${U.cls} · ${SCH}</small></div><div class="grid">${DB.subs.map(s=>{const n=cnt(s),on=s.on&&n;return`<button class="sub ${on?"":"off"}" ${on?`onclick="chaps('${s.id}')"`:"disabled"}><i>${s.icon}</i><b class="${s.dir=="rtl"?"rtl":""}">${esc(s.name)}</b><br><small>${on?n+" MCQs":"Coming soon"}</small></button>`}).join("")}</div>
<div id="rr">${resHTML()}</div><p><button class="btn o" onclick="out()">Logout</button></p>`;sync()}
function chaps(sid){document.body.className="";const s=DB.subs.find(x=>x.id==sid),ts=DB.tops.filter(t=>t.sid==sid),r=s.dir=="rtl"?"rtl":"";
$("#app").innerHTML=`<div class="hd ${r}" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${s.icon} ${esc(s.name)}<small>Touch a chapter to start</small></span><button class="nb pv" dir="ltr" onclick="home()">◀ Subjects</button></div><div class="${r}"><div class="row" onclick="setup('${sid}',-1)"><b>All chapters (full test)</b><span>${cnt(s)} Qs ›</span></div>${ts.map((t,i)=>`<div class="row" onclick="setup('${sid}',${i})"><span>${esc(t.t)}</span><span>${t.q.length} Qs ›</span></div>`).join("")}</div>`}
function setup(sid,i){document.body.className="";const s=DB.subs.find(x=>x.id==sid),ts=DB.tops.filter(t=>t.sid==sid),sel=i<0?ts:[ts[i]],qs=sel.flatMap(t=>t.q.map(q=>({...q,c:t.t}))),m=Math.max(5,Math.ceil(qs.length*.75));
T={s,qs,a:[],c:i<0?"All chapters":ts[i].t,m};const opts=[...new Set([m,5,10,15,20,30,45,60])].sort((a,b)=>a-b);
$("#app").innerHTML=`<div class="hd">${esc(s.name)} · ${esc(T.c)}<small>${qs.length} questions</small></div><div class="card">Time (minutes)<select id="tm">${opts.map(o=>`<option ${o==m?"selected":""}>${o}</option>`).join("")}</select><label><input type="checkbox" id="sh" style="width:auto"> Shuffle questions</label><br><button class="btn" onclick="start()">Start test</button> <button class="btn o" onclick="chaps('${s.id}')">Back</button></div>`}
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const ac=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
function tone(f,t,d,ty,v){try{const A=ac(),o=A.createOscillator(),g=A.createGain();o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.15,A.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+t+d);o.connect(g);g.connect(A.destination);o.start(A.currentTime+t);o.stop(A.currentTime+t+d)}catch(e){}}
const good=()=>snd&&(tone(660,0,.12),tone(880,.12,.2)),bad=()=>{if(snd)tone(140,0,.35,"sawtooth",.2);navigator.vibrate&&navigator.vibrate(150)};
function clap(){if(!snd)return;try{const A=ac();for(let k=0;k<16;k++){const b=A.createBuffer(1,2205,44100),d=b.getChannelData(0);for(let i=0;i<2205;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/2205,3);const s=A.createBufferSource(),g=A.createGain();g.gain.value=.5;s.buffer=b;s.connect(g);g.connect(A.destination);s.start(A.currentTime+k*.17+Math.random()*.07)}}catch(e){}}
function start(){T.tot=T.left=+$("#tm").value*60;if($("#sh").checked)T.qs.sort(()=>Math.random()-.5);T.a=[];T.i=0;document.body.className="qz";qz();iv=setInterval(()=>{T.left--;const e=$("#tl");if(e)e.textContent=fmt(T.left);if(T.left<=0)finish()},1000)}
function qh(x,i,rev,a){const L=x.o.some(o=>o.length>40);return`<div class="q c${i%6}"><div class="qt"><span>${i+1}</span><span>${esc(x.q)}</span></div><div class="os ${L?"o1":""}">${x.o.map((o,j)=>`<button class="op ${rev?(j==x.a?"ok":j==a?"no":""):""}" ${rev?"disabled":`onclick="pick(${i},${j})"`}><b>${"ABCD"[j]}</b><span>${esc(o)}${rev&&j==x.a?" ✓":""}${rev&&j==a&&j!=x.a?" ✗":""}</span></button>`).join("")}</div>${rev?`<div class="fb" style="color:${a===x.a?"#16a34a":"#dc2626"}">${a==null?"Not attempted":a===x.a?"✓ Correct!":"✗ Wrong — correct answer is "+"ABCD"[x.a]}</div>`:""}${rev&&x.n?`<div class="nt">ℹ ${esc(x.n)}</div>`:""}</div>`}
function qz(){const i=T.i,x=T.qs[i],n=T.qs.length,ok=T.a.filter((v,k)=>v===T.qs[k].a).length,da=T.a.filter(v=>v!=null).length;
$("#app").innerHTML=`<div class="bar"><span>⏱ <span id="tl">${fmt(T.left)}</span></span><span>✓${ok} ✗${da-ok}</span><span>${i+1}/${n}</span></div><div class="nv">${T.qs.map((y,k)=>`<a class="${T.a[k]==null?"":T.a[k]===y.a?"g":"r"} ${k==i?"cur":""}" onclick="go(${k})">${k+1}</a>`).join("")}</div><div class="${T.s.dir=="rtl"?"rtl":""}">${qh(x,i,T.a[i]!=null||T.done,T.a[i])}</div><div class="nvb"><button class="nb pv" onclick="go(${i-1})" ${i?"":"disabled"}>◀ Prev</button><button class="nb hm" onclick="if(T.done||confirm('Leave test? Progress will be lost.'))route()">🏠 Home</button><button class="nb fn" onclick="if(T.done)showRes();else if(T.a.filter(v=>v!=null).length==T.qs.length||confirm('Finish test now?'))finish()">${T.done?"Result":"Finish ✔"}</button><button class="nb nx" onclick="go(${i+1})" ${i<n-1?"":"disabled"}>Next ▶</button></div>`;scrollTo(0,0)}
const go=k=>{if(k>=0&&k<T.qs.length){T.i=k;qz()}};
function pick(i,j){if(T.done||T.a[i]!=null)return;T.a[i]=j;j===T.qs[i].a?good():bad();qz()}
function finish(){clearInterval(iv);if(!T.done){T.done=1;const n=T.qs.length,sc=T.qs.filter((x,i)=>T.a[i]===x.a).length,wr=T.a.filter((x,i)=>x!=null&&x!==T.qs[i].a).length,pc=Math.round(sc/n*100);T.res={n,sc,wr,pc,used:T.tot-Math.max(T.left,0)};
addRes({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:new Date().toISOString(),s:T.s.name,c:T.c,sc,n});if(pc>=80)clap()}qz();showRes()}
function showRes(){const r=T.res,d=document.createElement("div");d.className="ov";d.innerHTML=`<div class="mb"><div class="big">${r.pc>=80?"👏 ":""}${r.sc} / ${r.n}</div><b style="font-size:1.3em">${r.pc}%</b>${r.pc>=80?"<br><b>Excellent work! 🎉</b>":""}<p>✓ ${r.sc} · ✗ ${r.wr} · Skipped ${r.n-r.sc-r.wr} · ⏱ ${fmt(r.used)}</p><button class="nb nx" onclick="this.closest('.ov').remove();setup('${T.s.id}',${DB.tops.filter(t=>t.sid==T.s.id).findIndex(t=>t.t==T.c)})">↻ Retake</button><button class="nb pv" onclick="this.closest('.ov').remove()">👁 Review</button><button class="nb hm" onclick="route()">🏠 Home</button></div>`;document.body.appendChild(d)}
addEventListener("resize",()=>dev=="auto"&&setDev("auto"));
if(!NATIVE&&"serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});
const prog=(p,x)=>{const i=$("#pgi");if(i){i.style.width=p+"%";$("#pgt").textContent=x}};
const hideSp=()=>{const e=$("#sp");e&&e.remove()};prog(25,"Loading app…");top_();route();prog(45,"Checking for updates…");
Promise.allSettled([checkApp().then(()=>prog(70,"App checked ✓")),checkSheet().then(()=>prog(100,"Questions ready ✓"))]).then(()=>setTimeout(hideSp,450));setTimeout(hideSp,7000);
</script></body></html>
