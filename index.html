const HD=[{"a":"عَنْ مُعَاوِيَةَ رضي الله عنه قَالَ: سَمِعْتُ النَّبِيَّ ﷺ يَقُوْلُ: مَن يُرِدِ اللهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّيْنِ، وَإِنَّمَا أَنَا قَاسِمٌ وَاللهُ يُعْطِي.","u":"حضرت معاویہ رضی اللہ عنہ سے روایت ہے کہ میں نے حضور نبی اکرم ﷺ کو فرماتے ہوئے سنا: اللہ تعالیٰ جس کے ساتھ بھلائی کا ارادہ فرماتا ہے اسے دین کی سمجھ بوجھ عطا فرما دیتا ہے، اور میں تو بس تقسیم کرنے والا ہوں جبکہ دیتا اللہ تعالیٰ ہے۔","r":"متفق علیہ · صحیح بخاری، کتاب العلم، رقم 71","s":"باب 8 · حدیث 461","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَنَسٍ بْنِ مَالِکٍ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: مَنْ خَرَجَ فِي طَلَبِ الْعِلْمِ کَانَ فِي سَبِيْلِ اللهِ حَتَّى يَرْجِعَ.","u":"حضرت انس رضی اللہ عنہ فرماتے ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: جو شخص حصولِ علم کے لئے نکلا وہ اس وقت تک اللہ تعالیٰ کی راہ میں ہے جب تک کہ واپس نہیں لوٹ آتا۔","r":"جامع ترمذی، کتاب العلم، رقم 2647","s":"باب 8 · حدیث 462","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: سَمِعْتُ رَسُوْلَ اللهِ ﷺ يَقُوْلُ: أَ لَا! إِنَّ الدُّنْيَا مَلْعُوْنَةٌ مَلْعُوْنٌ مَا فِيْهَا إِلَّا ذِکْرُ اللهِ وَمَا وَالَاهُ وَعَالِمٌ أَوْ مُتَعَلِّمٌ.","u":"حضرت ابوہریرہ رضی اللہ عنہ روایت کرتے ہیں کہ میں نے حضور نبی اکرم ﷺ کو یہ فرماتے ہوئے سنا: اللہ تعالیٰ کا ذکر اور اس کا دم بھرنے والے اور عالم اور طالب علموں کو چھوڑ کر بقایا دنیا اور جو کچھ اس (دنیا) میں ہے سب ملعون ہیں۔","r":"جامع ترمذی رقم 2322، ابن ماجہ رقم 4112","s":"باب 8 · حدیث 463","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: مَنْ تَعَلَّمَ عِلْمًا مِمَّ يُبْتَغَي بِهِ وَجْهُ اللهِ، لا يَتَعَلَّمُهُ إِلاَّ لِيُصِيْبَ بِهِ عَرَضًا مِنَ الدُّنْيَا، لَمْ يَجِدْ عَرْفَ الْجَنَّةِ يَوْمَ الْقِيَامَةِ يَعْنِي رِيْحَهَا.","u":"حضرت ابوہریرہ رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: جس نے علم حاصل کیا جس سے اللہ تعالیٰ کی رضامندی حاصل کی جاتی ہے لیکن (اگر) وہ یہ علم حصولِ دنیا کے لئے سیکھتا ہے تو قیامت کے روز وہ جنت کی خوشبو بھی نہیں پائے گا۔","r":"سنن ابو داؤد رقم 3664، ابن ماجہ رقم 252","s":"باب 8 · حدیث 464","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي أُمَامَةَ الْبَاهِلِيِّ رضي الله عنه، قَالَ: ذُکِرَ لِرَسُوْلِ اللهِ ﷺ رَجُلاَنِ: أَحَدُهُمَا عَابِدٌ وَالْآخَرُ عَالِمٌ، فَقَالَ رَسُوْلُ اللهِ ﷺ: فَضْلُ الْعَالِمِ عَلىٰ الْعَابِدِ، کَفَضْلِي عَلىٰ أَدْنَاکُمْ، ثُمَّ قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّ اللهَ، وَمَلاءِکَتَهُ، وَأَهْلَ السَّمَوَاتِ، وَالْأَرْضِيْنَ، حَتَّى النَّمْلَةَ فِي جُحْرِهَا وَحَتَّى الْحُوْتَ، لَيُصَلُّوْنَ عَلىٰ مُعَلِّمِ النَّاسِ الْخَيْرَ.","u":"حضرت ابو اُمامہ باہلی رضی اللہ عنہ سے روایت ہے کہ حضور نبی اکرم ﷺ کے سامنے دو آدمیوں کا ذکر کیا گیا: جن میں سے ایک عابد تھا اور دوسرا عالم، حضور نبی اکرم ﷺ نے فرمایا: عابد پر عالم کی فضیلت اسی طرح ہے جس طرح میری فضیلت تم میں سے ایک ادنی (صحابی) پر ہے۔ پھر آپ ﷺ نے فرمایا: بے شک اللہ تعالیٰ، اس کے فرشتے، (تمام) زمین و آسمان والے یہاں تک کہ چیونٹی اپنے بل میں اور مچھلیاں (بھی سمندروں، دریاؤں اور تالابوں میں) اس شخص کے لئے رحمت (کی دعا) مانگتے ہیں جو لوگوں کو بھلائی کی تعلیم دیتا ہے۔","r":"جامع ترمذی رقم 2685، سنن دارمی رقم 289","s":"باب 8 · حدیث 465","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي الدَّرْدَاءِ رضي الله عنه قَالَ: سَمِعْتُ رَسُوْلَ اللهِ ﷺ، يَقُولُ: مَنْ سَلَکَ طَرِيْقًا يَبْتَغِي فِيْهِ عِلْمًا سَلَکَ اللهُ لَهُ طَرِيْقًا إِلَي الْجَنَّةِ، وَإِنَّ الْمَلَائِکَةَ لَتَضَعُ أَجْنِحَتَهَا، رِضَاءً لِطَالِبِ الْعِلْمِ.","u":"حضرت ابودرداء رضی اللہ عنہ فرماتے ہیں کہ میں نے حضور نبی اکرم ﷺ کو فرماتے ہوئے سنا: جو آدمی طلبِ علم میں کسی راستہ پر چلتا ہے تو اللہ تعالیٰ اسے جنت کے راستے پر چلا دیتا ہے۔ اور بیشک فرشتے طالبِ علم کی رضا کے حصول کے لئے اس کے پاؤں تلے اپنے پر بچھاتے ہیں۔","r":"جامع ترمذی رقم 2682 (حدیث کا ابتدائی حصہ)","s":"باب 8 · حدیث 466","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنِ ابْنِ عَبَّاسٍ رضي الله عنهما، قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: فَقِيْهٌ أَشَدُّ عَلىٰ الشَّيْطَانِ مِنْ أَلْفِ عَابِدٍ. وفي رواية: وَلِکُلِّ شَيءٍ عِمَادٌ وَعِمَادُ هَذَا الدِّيْنِ الْفِقْهُ.","u":"حضرت عبد اللہ بن عباس رضی اللہ عنہما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: ایک فقیہ، ایک ہزار عابد سے زیادہ شیطان پر سخت اور بھاری ہے۔ اور ایک روایت کے الفاظ ہیں کہ ہر ایک شے کا ستون ہوتا ہے اور اس دین کا ستون (علم) فقہ ہے۔","r":"جامع ترمذی رقم 2681، ابن ماجہ رقم 222","s":"باب 8 · حدیث 467","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَنَسِ بنِ مَالِکٍ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّ مَثَلَ الْعُلَمَاءِ فِي الْأَرْضِ کَمَثَلِ النُّجُومِ فِي السَّمَاءِ يُهتَدَي بِهَا فِي ظُلُمَاتِ الْبَرِّ وَالْبَحْرِ فَإِذَا انْطَمَسَتِ النُّجُوْمُ أَوْشَکَ أَنْ تَضِلَّ الْهُدَاةُ.","u":"حضرت انس بن مالک رضی اللہ عنہ سے روایت ہے کہ حضور نبی اکرم ﷺ نے فرمایا: علمائے کرام زمین میں ان ستاروں کی طرح ہیں جن کے ذریعے بحر و بر کے اندھیروں میں رہنمائی حاصل کی جاتی ہے۔ اور اگر ستارے غروب ہوجائیں تو قریب ہے کہ (مسافروں کو راستہ دکھانے والے) رہنما بھٹک جائیں۔ (یعنی علماء کرام نہیں ہوں گے تو عوام گمراہ ہو جائیں گے)۔","r":"مسند احمد بن حنبل رقم 12621","s":"باب 8 · حدیث 468","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ عَبْدِ اللهِ ابْنِ عُمَرَ رضي الله عنهما قَالَ: سَمِعْتُ رَسُوْلَ اللهِ ﷺ يَقُوْلُ: لَا حَسَدَ إِلاَّ عَلَى اثْنَتَيْنِ: رَجُلٌ آتَاهُ اللهُ الْکِتَابَ وَقَامَ بِهِ آنَاءَ اللَّيْلِ، وَرَجُلٌ أَعْطَاهُ اللهُ مَالًا فَهُوَ يَتَصَدَّقُ بِهِ آنَاءَ اللَّيْلِ وَالنَّهَارِ.","u":"حضرت عبداللہ بن عمر رضی اللہ عنھما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: حسد (یعنی رشک) صرف دو آدمیوں سے کرنا چاہئے: ایک وہ شخص جسے اللہ تعالیٰ نے قرآنِ پاک عطا کیا ہوا اور وہ رات کو نماز میں اس کی تلاوت کرے، دوسرا وہ شخص ہے جسے اللہ تعالیٰ نے مال و دولت سے نوازا ہو وہ اسے رات کی گھڑیوں اور دن کے مختلف حصوں میں (راہِ الٰہی میں) خرچ کرتا رہے۔","r":"متفق علیہ · صحیح بخاری رقم 4737","s":"باب 8 · حدیث 46","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنِ ابْنِ عَبَّاسٍ رضي الله عنهما قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: أَشْرَافُ أُمَّتِي حَمَلَةُ الْقُرْآنِ وَأَصْحَابُ اللَّيْلِ.","u":"حضرت عبد اللہ بن عباس رضی اللہ عنھما سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: قرآن کے عالم و عامل اور شب زندہ دار (لوگ) میری امت کے اشراف (سردار) ہیں۔","r":"شعب الایمان للبیہقی رقم 2703","s":"باب 8 · حدیث 52","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ عَبْدِ اللهِ بْنِ سَلَامٍ رضي الله عنه قَالَ: وَکَانَ أَوَّلُ مَا سَمِعْتُ مِنْ کَلَامِهِ ﷺ أَنْ قَالَ: أَيُّهَا النَّاسُ أَفْشُوا السَّلَامَ وَأَطْعِمُوْا الطَّعَامَ وَصِلُوا الْأَرْحَامَ وَصَلُّوْا بِاللَّيْلِ وَالنَّاسُ نِيَامٌ تَدْخُلُوْنَ الْجَنَّةَ بِسَلَامٍ.","u":"حضرت عبد اللہ بن سلام رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ کا سب سے پہلا کلام جو میں نے سنا یہ تھا، آپ ﷺ نے فرمایا: اے لوگو! سلام پھیلاؤ (یعنی کثرت سے ایک دوسرے کو سلام کیا کرو) کھانا کھلایا کرو، خونی رشتوں کے ساتھ بھلائی کیا کرو اور راتوں کو (اٹھ کر) نماز پڑھا کرو، جب کہ لوگ سوئے ہوئے ہوں تم سلامتی کے ساتھ جنت میں داخل ہو جاؤ گے۔","r":"جامع ترمذی رقم 2485، ابن ماجہ رقم 1334","s":"باب 8 · حدیث 55","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ أَبِي هُرَيْرَةَ رضي الله عنه أَنَّ رَسُوْلَ اللهِ ﷺ قَالَ: إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلَّا مِنْ ثَلَاثَةٍ: إِلَّا مِنْ صَدَقَةٍ جَارِيَةٍ. أَوْ عِلْمٍ يُنْتَفَعُ بِهِ. أَوْ وَلَدٍ صَالِحٍ يَدْعُوْ لَهُ.","u":"حضرت ابوہریرہ رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: جب انسان مر جاتا ہے تو اس کے اعمال کا سلسلہ ختم ہو جاتا ہے سوائے تین چیزوں کے (ان کا اجر اسے برابر ملتا رہتا ہے: ) ایک وہ صدقہ جس کا نفع جاری رہے، دوسرا وہ علم جس سے فائدہ اٹھایا جائے تیسری وہ نیک اولاد جو اس کے لئے دعا کرے۔","r":"صحیح مسلم رقم 1631، ابو داؤد رقم 2880","s":"باب 8 · حدیث 87","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/506/"},{"a":"عَنْ عَائِشَةَ رضي الله عنها قَالَتْ: قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّ مِنْ أَکْمَلِ الْمُؤْمِنِيْنَ إِيْمَانًا أَحْسَنُهُمْ خُلُقًا وَأَلْطَفُهُمْ بِأَهْلِهِ.","u":"حضرت عائشہ رضی اللہ عنہا روایت کرتی ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: مومنوں میں سے کامل ترین مومن وہ ہے جو بہترین اخلاق کا مالک ہے۔ اور اپنے اہل و عیال کے ساتھ انتہائی نرم ہے۔","r":"جامع ترمذی رقم 2612","s":"باب 14 · حدیث 875","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي الدَّرْدَاءِ رضي الله عنه عَنِ النَّبِيِّ ﷺ قَالَ: مَا مِنْ شَيءٍ أَثْقَلُ فِي الْمِيْزَانِ مِنْ حُسْنِ الْخُلُقِ.","u":"حضرت ابودرداء رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: حسنِ اخلاق سے بڑھ کر میزان میں بھاری چیز کوئی نہیں ہوگی۔","r":"جامع ترمذی رقم 2002، ابو داؤد رقم 4799","s":"باب 14 · حدیث 879","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ جَابِرِ رضي الله عنه أَنَّ رَسُوْلَ اللهِ ﷺ قَالَ: إِنَّ مِنْ أَحَبِّکُمْ إِلَيَّ وَأَقْرَبِکُمْ مِنِّي مَجْلِسًا يَوْمَ الْقِيَامَةِ أَحَاسِنَکُمْ أَخْلَاقًا.","u":"حضرت جابر رضی اللہ عنہ روایت کرتے ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: تم میں سب سے زیادہ محبوب اور قیامت کے دن میرے نزدیک ترین بیٹھنے والے وہ لوگ ہیں جو تم میں سے اخلاق میں اچھے ہیں۔","r":"جامع ترمذی رقم 2018","s":"باب 14 · حدیث 877","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي ذَرٍّ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: تَبَسُّمُکَ فِي وَجْهِ أَخِيْکَ لَکَ صَدَقَةٌ.","u":"حضرت ابوذر رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: تمہارا اپنے مسلمان بھائی کے لئے مسکرانا بھی صدقہ ہے۔","r":"جامع ترمذی رقم 1956","s":"باب 14 · حدیث 881","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ جَرِيْرٍ رضي الله عنه عَنِ النَّبِيِّ ﷺ قَالَ: مَنْ يُحْرَمِ الرِّفْقَ يُحْرَمِ الْخَيْرَ.","u":"حضرت جریر رضی اللہ عنہ سے روایت ہے کہ حضور نبی اکرم ﷺ نے فرمایا: جو نرمی سے محروم ہوا وہ خیر سے محروم ہو گیا۔","r":"صحیح مسلم رقم 2592، ابو داؤد رقم 4809","s":"باب 14 · حدیث 884","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ عَبْدِ اللهِ بْنِ مَسْعُودٍ رضي الله عنه قَالَ: سَأَلْتُ رَسُوْلَ اللهِ ﷺ أَيُّ الْعَمَلِ أَحَبُّ إِلَی اللهِ؟ قَالَ: الصَّلَاةُ عَلَى وَقْتِهَا قَالَ: ثُمَّ أَيٌّ؟ قَالَ: بِرُّ الْوَالِدَيْنِ قَالَ: ثُمَّ أَيٌّ؟ قَالَ: اَلْجِهَادُ فِي سَبِيْلِ اللهِ.","u":"حضرت عبداللہ بن مسعود رضی اللہ عنہ فرماتے ہیں کہ میں نے حضور نبی اکرم ﷺ سے دریافت کیا: اللہ تعالیٰ کو کون سا عمل سب سے زیادہ پسند ہے؟ آپ ﷺ نے فرمایا: وقت پر نماز پڑھنا۔ میں نے عرض کیا: پھر کون سا؟ آپ ﷺ نے فرمایا: والدین سے حسن سلوک کرنا۔ میں نے عرض کیا: پھر کون سا؟ آپ ﷺ نے فرمایا: اللہ تعالیٰ کی راہ میں جہاد کرنا۔","r":"متفق علیہ · صحیح بخاری رقم 504، صحیح مسلم رقم 85","s":"باب 14 · حدیث 890","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي أُمَامَةَ رضي الله عنه أَنَّ رَجُلًا قَالَ: يَا رَسُوْلَ اللهِ! مَا حَقُّ الْوَالِدَيْنِ عَلَى وَلَدِهِمَا؟ قَالَ: هُمَا جَنَّتُکَ وَنَارُکَ.","u":"حضرت ابو امامہ رضی اللہ عنہ روایت کرتے ہیں کہ ایک آدمی آیا اور اس نے عرض کیا: یا رسول اللہ! والدین کا اپنی اولاد پر کتنا حق ہے؟ آپ ﷺ نے فرمایا: وہ دونوں تیری جنت (بھی) ہیں اور دوزخ (بھی)۔ (یعنی ان کی خدمت کرکے جنت حاصل کرلو یا نافرمانی کرکے دوزخ کے مستحق ہو جاؤ)۔","r":"سنن ابن ماجہ رقم 3662","s":"باب 14 · حدیث 895","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ جَاهِمَةَ رضي الله عنه قَالَ: أَ  رَسُوْلُ اللهِ ﷺ: لَيْسَ مِنَّا مَنْ لَمْ يَرْحَمْ صَغِيرَنَا، وَيَعْرِفْ شَرَفَ کَبِيْرِنَا.","u":"حضرت عمرو بن شعیب رضی اللہ عنہ بواسطہ اپنے والد اپنے دادا سے روایت کرتے ہیں کہ حضور نبی اکرم ﷺ نے فرمایا: وہ شخص ہم میں سے نہیں ہے جو ہمارے چھوٹوں پر رحم نہ کرے اور ہمارے بڑوں کی قدر و منزلت نہ پہچانے۔","r":"جامع ترمذی رقم 1920، ابو داؤد رقم 4941","s":"باب 14 · حدیث 923","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"},{"a":"عَنْ أَبِي الدَّرْدَاءِ رضي الله عنه قَالَ: قَالَ رَسُوْلُ اللهِ ﷺ: إِنَّکُمْ تُدْعَوْنَ يَوْمَ الْقِيَامَةِ بِأَسْمَائِکُمْ وَأَسْمَاءِ آبَائِکُمْ فَأَحْسِنُوْا أَسْمَاءَ کُمْ.","u":"حضرت ابودرداء رضی اللہ عنہ سے مروی ہے کہ حضور نبی اکرم ﷺ نے فرمایا: تم قیامت کے روز اپنے ناموں اور اپنے باپوں کے ناموں سے پکارے جاؤ گے، لہٰذا اپنے (اور اپنے بچوں کے) نام خوبصورت رکھا کرو۔","r":"سنن ابو داؤد رقم 4948","s":"باب 14 · حدیث 918","l":"https://www.minhajbooks.com/english/book/Al-Minhaj-al-Sawi-min-al-Hadith-al-Nabawi/read/txt/btid/512/"}];

function omrDisc(bin,w,h,u,v,r){let d=0,t=0;for(let y=Math.floor(v-r);y<=Math.ceil(v+r);y++)for(let x=Math.floor(u-r);x<=Math.ceil(u+r);x++){if((x-u)*(x-u)+(y-v)*(y-v)>r*r)continue;if(x<0||y<0||x>=w||y>=h)continue;t++;d+=bin[y*w+x]}return t?d/t:0}
function omrSample(bin,w,h,H,pg){const groups=omrGroups(pg).map(g=>{const f=[],uv=[];let rad=0;g.p.forEach(([tx,ty])=>{const[u,v]=omrMap(H,tx,ty),[u2,v2]=omrMap(H,tx+1,ty),sc=Math.hypot(u2-u,v2-v);rad=g.R*sc;uv.push([u,v]);f.push(omrDisc(bin,w,h,u,v,g.R*.72*sc))});return{k:g.k,i:g.i,f,uv,rad}}),stray=[];

function omrPick(f){const on=[];f.forEach((v,i)=>{if(v>=.62)on.push(i)});if(on.length)return on;const o=f.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);if(o[0][0]>=.40&&o[0][0]>=2.2*o[1][0]+.15)return[o[0][1]];return[]}
